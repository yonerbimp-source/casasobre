<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d3b66">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mis Sobres</title>
<style>
:root{--blue:#0d3b66;--blue2:#146da0;--green:#268a3a;--green2:#49a942;--gold:#f2b827;--bg:#f5f7fa;--card:#fff;--text:#142033;--muted:#667085;--border:#d9e1ea;--danger:#b42318;--soft:#eef4f9}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002} .brand{display:flex;gap:12px;align-items:center;max-width:980px;margin:auto}.brand img{width:52px;height:52px;border-radius:13px}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;font-size:13px;opacity:.88}
main{max-width:980px;margin:auto;padding:14px 12px 88px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 2px 8px #0d3b6610}.stat small,.muted{color:var(--muted)}.stat strong{display:block;font-size:19px;margin-top:4px}.gold{color:#9b6a00}.green{color:var(--green)}.red{color:var(--danger)}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.btn{border:0;border-radius:12px;padding:12px 13px;font-weight:700;cursor:pointer;min-height:46px;background:var(--blue);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.gold{background:var(--gold);color:#3d2a00}.btn.soft{background:var(--soft);color:var(--blue)}.btn.danger{background:#fee4e2;color:var(--danger)}.btn.outline{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0 14px;padding-bottom:2px}.tab{white-space:nowrap;border:1px solid var(--border);background:#fff;color:var(--blue);border-radius:999px;padding:9px 13px;font-weight:700}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}.section-title h2{font-size:18px;margin:0}.envelope{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.envelope h3{margin:0 0 4px;font-size:16px}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;background:var(--soft);color:var(--blue);font-weight:700}.pill.priority{background:#fff4cc;color:#795600}.money{font-weight:800}.submoney{font-size:13px;color:var(--muted);margin-top:2px}.row-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.mini{border:1px solid var(--border);background:#fff;border-radius:9px;padding:7px 9px;color:var(--blue);font-weight:650}
.empty{text-align:center;color:var(--muted);padding:24px 8px}.history-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--border)}.history-item:last-child{border-bottom:0}.history-item strong{display:block}.receipt{border:0;background:#fff3cd;border-radius:9px;padding:6px 9px;cursor:pointer}.positive{color:var(--green)}.negative{color:var(--danger)}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:center;padding:8px;z-index:5}.bottom .btn{width:min(520px,96%);font-size:16px}
dialog{border:0;border-radius:18px;padding:0;max-width:620px;width:calc(100% - 24px);box-shadow:0 20px 70px #0005}dialog::backdrop{background:#001d3d99}.modal{padding:18px}.modal h3{margin:0 0 13px}.form-grid{display:grid;gap:10px}.field label{display:block;font-size:13px;font-weight:750;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:#fff}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px;flex-wrap:wrap}.preview{max-height:55vh;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:10px}.preview-line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border)}.preview-line:last-child{border-bottom:0}.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px}.photo-view img{max-width:100%;max-height:70vh;display:block;margin:auto;border-radius:12px}.settings-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.special{border-left:5px solid var(--gold)}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}.actions{grid-template-columns:repeat(4,minmax(0,1fr))}.photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style>
</head>
<body>
<header><div class="brand"><img src="icon-192.png" alt="Ícono Mis Sobres"><div><h1>Mis Sobres</h1><p>Administra con propósito lo que Dios pone en tus manos.</p></div></div></header>
<main>
<section class="grid stats" id="stats"></section>
<section class="actions">
<button class="btn green" id="addIncomeBtn">+ Agregar entrada</button>
<button class="btn gold" id="distributeBtn">Distribuir</button>
<button class="btn soft" id="transferBtn">Transferir</button>
<button class="btn soft" id="addEnvelopeBtn">+ Nuevo sobre</button>
</section>
<nav class="tabs" id="tabs">
<button class="tab active" data-view="envelopes">Sobres</button><button class="tab" data-view="available">Disponible</button><button class="tab" data-view="income">Entradas</button><button class="tab" data-view="distributions">Distribuciones</button><button class="tab" data-view="settings">Configuración</button>
</nav>
<section id="view"></section>
</main>
<div class="bottom"><button class="btn" id="quickExpenseBtn">− Registrar gasto</button></div>
<dialog id="modal"><div class="modal" id="modalBody"></div></dialog>
<script>
const DB='mis-sobres-db', STORE='state';
const defaultState={schemaVersion:3,rate:56,available:{DOP:0,USD:0},envelopes:[],transactions:[],incomes:[],distributions:[],createdAt:new Date().toISOString()};
let state=structuredClone(defaultState), currentView='envelopes';
const $=s=>document.querySelector(s), fmt=(n,c)=>new Intl.NumberFormat('es-DO',{style:'currency',currency:c==='DOP'?'DOP':'USD',maximumFractionDigits:2}).format(Number(n)||0);
const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>new Date().toISOString().slice(0,10); const now=()=>new Date().toISOString();
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){const db=await openDB();state=await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get('app');r.onsuccess=()=>res(r.result||structuredClone(defaultState));r.onerror=()=>rej(r.error)});ensureSpecial();let changed=false;if(migrateV2())changed=true;if(migrateV3())changed=true;if(changed){await save();return}render()}
async function save(){const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,'app');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});render()}
function ensureSpecial(){if(!state.envelopes.some(e=>e.special==='tithe'))state.envelopes.unshift({id:uid(),name:'Diezmo',currency:'DOP',request:0,priority:true,balance:{DOP:0,USD:0},special:'tithe'});if(!state.envelopes.some(e=>e.special==='offering'))state.envelopes.splice(1,0,{id:uid(),name:'Ofrenda',currency:'DOP',request:0,priority:true,balance:{DOP:0,USD:0},special:'offering'})}
function migrateV2(){if((state.schemaVersion||1)>=2)return false;let restored=0;for(const d of state.distributions||[]){const allocated=(d.allocations||[]).reduce((sum,a)=>sum+(Number(a.amountDOP)||0),0),base=Number(d.baseDOP)||0,tithe=Number(d.titheDOP)||0,offering=Number(d.offeringDOP)||0,leftover=Math.max(0,base-tithe-offering-allocated);d.leftoverDOP=leftover;d.actualUsedDOP=Math.max(0,base-leftover);d.fixedV2=true;if(leftover>0.005){state.available.DOP=(state.available.DOP||0)+leftover;restored+=leftover}}state.schemaVersion=2;if(restored>0.005)state.transactions.push({id:uid(),accountType:'available',accountId:null,type:'add',amount:restored,currency:'DOP',note:'Corrección automática: sobrante de distribuciones anteriores',date:now(),receipts:[]});return true}
function migrateV3(){if((state.schemaVersion||1)>=3)return false;state.incomes=state.incomes||[];state.distributions=state.distributions||[];state.transactions=state.transactions||[];for(const i of state.incomes){const tx=state.transactions.find(t=>t.accountType==='available'&&t.type==='add'&&!t.incomeId&&t.date===i.date&&Number(t.amount)===Number(i.amount)&&t.currency===i.currency&&String(t.note||'').startsWith('Entrada'));if(tx)tx.incomeId=i.id}
const remaining=new Map(state.incomes.map(i=>[i.id,(i.currency==='DOP'?Number(i.amount):Number(i.amount)*state.rate)]));for(const d of [...state.distributions].sort((a,b)=>String(a.date).localeCompare(String(b.date)))){if(!Array.isArray(d.sourceUses)){let need=Number(d.actualUsedDOP)||0;d.sourceUses=[];for(const i of [...state.incomes].sort((a,b)=>String(a.date).localeCompare(String(b.date)))){if(String(i.date)>String(d.date)||need<=0.005)continue;const left=Math.max(0,remaining.get(i.id)||0),use=Math.min(left,need);if(use>0.005){d.sourceUses.push({incomeId:i.id,amountDOP:use});remaining.set(i.id,left-use);need-=use}}}for(const t of state.transactions){if(t.distributionId)continue;if(t.date!==d.date)continue;const n=String(t.note||'');if(n===`Diezmo · ${d.name}`||n===`Ofrenda · ${d.name}`||n.startsWith(`Distribución · ${d.name}`))t.distributionId=d.id}}
state.schemaVersion=3;return true}
function incomeDOP(i){return i.currency==='DOP'?Number(i.amount)||0:(Number(i.amount)||0)*state.rate}
function incomeUsedDOP(id){return state.distributions.reduce((s,d)=>s+(d.sourceUses||[]).filter(u=>u.incomeId===id).reduce((a,u)=>a+(Number(u.amountDOP)||0),0),0)}
function incomeDistributions(id){return state.distributions.filter(d=>(d.sourceUses||[]).some(u=>u.incomeId===id))}
function sourceUsesForDistribution(amountDOP){let need=amountDOP,uses=[];for(const i of [...state.incomes].sort((a,b)=>String(a.date).localeCompare(String(b.date)))){const left=Math.max(0,incomeDOP(i)-incomeUsedDOP(i.id)),use=Math.min(left,need);if(use>0.005){uses.push({incomeId:i.id,amountDOP:use});need-=use}if(need<=0.005)break}return uses}

function toDOP(obj){return (obj.DOP||0)+(obj.USD||0)*state.rate} function fromDOP(v,c){return c==='DOP'?v:v/state.rate} function eqPair(obj){let d=toDOP(obj);return `${fmt(d,'DOP')} · ${fmt(d/state.rate,'USD')}`}
function totalEnvelopeDOP(){return state.envelopes.reduce((s,e)=>s+toDOP(e.balance),0)}
function totalDOP(){return totalEnvelopeDOP()+toDOP(state.available)}
function nextNeedDOP(){return state.envelopes.filter(e=>!e.special).reduce((s,e)=>s+(e.currency==='DOP'?e.request:e.request*state.rate),0)}
function renderStats(){const avail=toDOP(state.available),need=nextNeedDOP();$('#stats').innerHTML=`<div class="card stat"><small>Patrimonio total</small><strong>${fmt(totalDOP(),'DOP')}</strong><span class="submoney">${fmt(totalDOP()/state.rate,'USD')}</span></div><div class="card stat"><small>Disponible</small><strong>${fmt(avail,'DOP')}</strong><span class="submoney">${fmt(avail/state.rate,'USD')}</span></div><div class="card stat"><small>Solicitado por sobres</small><strong>${fmt(need,'DOP')}</strong><span class="submoney">total solicitado por distribución</span></div><div class="card stat"><small>Tasa manual</small><strong>US$1 = RD$${Number(state.rate).toFixed(2)}</strong></div>`}
function render(){renderStats();document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===currentView)); if(currentView==='envelopes')renderEnvelopes(); if(currentView==='available')renderAvailable(); if(currentView==='income')renderIncome(); if(currentView==='distributions')renderDistributions(); if(currentView==='settings')renderSettings()}
function renderEnvelopes(){const list=[...state.envelopes].sort((a,b)=>a.special? -1:b.special?1:a.name.localeCompare(b.name,'es'));$('#view').innerHTML=`<div class="section-title"><h2>Sobres</h2><span class="muted">Orden alfabético</span></div><div class="grid">${list.map(e=>`<article class="card envelope ${e.special?'special':''}"><div><h3>${esc(e.name)} ${e.priority&&!e.special?'<span class="pill priority">Prioridad</span>':''}</h3><div class="money">${eqPair(e.balance)}</div><div class="submoney">${e.special?(e.special==='tithe'?'10% fijo por distribución':'5% fijo por distribución'):`Solicita ${fmt(e.request,e.currency)} por distribución · Principal: ${e.currency==='DOP'?'RD$':'US$'}`}</div><div class="row-actions"><button class="mini" data-act="add" data-id="${e.id}">+ Agregar</button><button class="mini" data-act="expense" data-id="${e.id}">− Gasto</button><button class="mini" data-act="history" data-id="${e.id}">Historial</button>${!e.special?`<button class="mini" data-act="edit" data-id="${e.id}">Editar</button>`:''}</div></div><span class="pill">${e.currency==='DOP'?'RD$':'US$'}</span></article>`).join('')}</div>`;$('#view').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>handleEnvelope(b.dataset.act,b.dataset.id))}
function renderAvailable(){const tx=state.transactions.filter(t=>t.accountType==='available').sort((a,b)=>b.date.localeCompare(a.date));$('#view').innerHTML=`<div class="section-title"><h2>Disponible</h2></div><div class="card"><div class="money">${eqPair(state.available)}</div><div class="row-actions"><button class="mini" id="availAdd">+ Agregar</button><button class="mini" id="availExpense">− Gasto</button></div></div>${historyHTML(tx)}`;$('#availAdd').onclick=()=>moneyModal('available',null,'add');$('#availExpense').onclick=()=>moneyModal('available',null,'expense');bindReceiptButtons()}
function renderIncome(){const xs=[...state.incomes].sort((a,b)=>b.date.localeCompare(a.date));$('#view').innerHTML=`<div class="section-title"><h2>Entradas generales</h2></div>${xs.length?`<div class="grid">${xs.map(x=>{const used=incomeUsedDOP(x.id),total=incomeDOP(x),status=used<=0.005?'🟡 Pendiente de distribuir':'🟢 Distribuida';return `<article class="card"><div class="history-item"><div><strong>${fmt(x.amount,x.currency)}</strong><span class="muted">${x.date.slice(0,10)}${x.note?' · '+esc(x.note):''}</span><div class="submoney">${status}</div></div></div><div class="row-actions"><button class="mini" data-income-edit="${x.id}">Editar</button><button class="mini" style="color:var(--danger)" data-income-delete="${x.id}">Eliminar</button></div></article>`}).join('')}</div>`:'<div class="empty">Todavía no hay entradas.</div>'}`;document.querySelectorAll('[data-income-edit]').forEach(b=>b.onclick=()=>editIncome(b.dataset.incomeEdit));document.querySelectorAll('[data-income-delete]').forEach(b=>b.onclick=()=>deleteIncome(b.dataset.incomeDelete))}
function renderDistributions(){const xs=[...state.distributions].sort((a,b)=>b.date.localeCompare(a.date));$('#view').innerHTML=`<div class="section-title"><h2>Distribuciones</h2></div>${xs.length?`<div class="grid">${xs.map(d=>`<article class="card"><strong>${esc(d.name)}</strong><div class="muted">${d.date.slice(0,10)}</div><div class="submoney">Base: ${fmt(d.baseDOP,'DOP')} · Diezmo: ${fmt(d.titheDOP,'DOP')} · Ofrenda: ${fmt(d.offeringDOP,'DOP')}</div><div class="row-actions"><button class="mini" data-dist="${d.id}">Ver detalle</button></div></article>`).join('')}</div>`:'<div class="empty">Todavía no hay distribuciones.</div>'}`;document.querySelectorAll('[data-dist]').forEach(b=>b.onclick=()=>showDistribution(b.dataset.dist))}
function renderSettings(){$('#view').innerHTML=`<div class="section-title"><h2>Configuración</h2></div><div class="grid"><div class="card"><div class="settings-row"><div class="field"><label>Valor manual del dólar en pesos dominicanos</label><input type="number" id="rate" min="0.01" step="0.01" value="${state.rate}"></div><button class="btn" id="saveRate">Guardar</button></div><p class="muted">Ejemplo: si colocas 56, US$1 = RD$56.</p></div><div class="card"><strong>Respaldo</strong><p class="muted">Incluye saldos, historiales, distribuciones y fotos de recibos.</p><div class="row-actions"><button class="btn soft" id="backup">Crear respaldo</button><label class="btn outline" style="display:inline-flex;align-items:center;justify-content:center">Restaurar<input type="file" id="restore" accept="application/json" hidden></label></div></div></div>`;$('#saveRate').onclick=async()=>{const v=Number($('#rate').value);if(v>0){state.rate=v;await save()}};$('#backup').onclick=backup;$('#restore').onchange=restore}
function historyHTML(tx){return tx.length?`<div class="card" style="margin-top:12px">${tx.map(t=>`<div class="history-item"><div><strong class="${t.type==='expense'?'negative':'positive'}">${t.type==='expense'?'-':'+'}${fmt(t.amount,t.currency)}</strong><span class="muted">${t.date.slice(0,10)}${t.note?' · '+esc(t.note):''}</span></div>${t.receipts?.length?`<button class="receipt" data-receipts="${t.id}" title="Ver recibos">🧾 ${t.receipts.length}</button>`:''}</div>`).join('')}</div>`:'<div class="empty">No hay movimientos todavía.</div>'}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showModal(html){$('#modalBody').innerHTML=html;$('#modal').showModal();$('#modalBody').querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#modal').close())}
function handleEnvelope(act,id){const e=state.envelopes.find(x=>x.id===id);if(act==='add')moneyModal('envelope',id,'add');if(act==='expense')moneyModal('envelope',id,'expense');if(act==='history'){const tx=state.transactions.filter(t=>t.accountType==='envelope'&&t.accountId===id).sort((a,b)=>b.date.localeCompare(a.date));showModal(`<h3>${esc(e.name)} · Historial</h3>${historyHTML(tx)}<div class="modal-actions"><button class="btn soft" data-close>Cerrar</button></div>`);bindReceiptButtons()}if(act==='edit')editEnvelope(e)}
function moneyModal(accountType,id,type){const e=id?state.envelopes.find(x=>x.id===id):null;showModal(`<h3>${type==='expense'?'Registrar gasto':'Agregar dinero'} ${e?'· '+esc(e.name):'· Disponible'}</h3><form id="moneyForm" class="form-grid"><div class="field"><label>Monto</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Moneda</label><select name="currency"><option value="DOP">RD$</option><option value="USD">US$</option></select></div><div class="field"><label>Descripción (opcional)</label><input name="note"></div>${type==='expense'?`<div class="field"><label>Fotos de recibos (opcional, varias)</label><input name="receipts" type="file" accept="image/*" capture="environment" multiple></div>`:''}<div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn ${type==='expense'?'danger':'green'}">Guardar</button></div></form>`);$('#moneyForm').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),amount=Number(fd.get('amount')),currency=fd.get('currency');if(!(amount>0))return;let receipts=[];if(type==='expense'){for(const f of ev.currentTarget.receipts.files)receipts.push(await fileToDataURL(f))}const holder=accountType==='available'?state.available:e.balance;const dop=currency==='DOP'?amount:amount*state.rate;if(type==='expense'&&toDOP(holder)+1e-9<dop){alert('Ese saldo no tiene dinero suficiente para este gasto.');return}if(type==='expense')withdrawEquivalent(holder,amount,currency);else applyAmount(holder,amount,currency,1);state.transactions.push({id:uid(),accountType,accountId:id||null,type,amount,currency,note:String(fd.get('note')||''),date:now(),receipts});await save();$('#modal').close()}}
function applyAmount(holder,amount,currency,sign){holder[currency]=(holder[currency]||0)+amount*sign; if(Math.abs(holder[currency])<1e-9)holder[currency]=0}
function withdrawEquivalent(holder,amount,currency){let dop=currency==='DOP'?amount:amount*state.rate;if(currency==='DOP'){const useD=Math.min(holder.DOP||0,dop);holder.DOP-=useD;dop-=useD;if(dop>1e-9){holder.USD-=dop/state.rate}}else{let usd=amount;const useU=Math.min(holder.USD||0,usd);holder.USD-=useU;usd-=useU;if(usd>1e-9){holder.DOP-=usd*state.rate}}if(Math.abs(holder.DOP)<1e-9)holder.DOP=0;if(Math.abs(holder.USD)<1e-9)holder.USD=0}
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(f)})}
function bindReceiptButtons(){document.querySelectorAll('[data-receipts]').forEach(b=>b.onclick=()=>showReceipts(b.dataset.receipts))}
function showReceipts(id){const t=state.transactions.find(x=>x.id===id);if(!t)return;showModal(`<h3>Recibos</h3><div class="photo-grid">${(t.receipts||[]).map((src,i)=>`<div class="photo-card"><img src="${src}" alt="Recibo ${i+1}" data-photo="${i}"><button class="btn danger" data-delphoto="${i}" style="width:100%;margin-top:6px">Eliminar</button></div>`).join('')}</div><div class="field" style="margin-top:12px"><label>Agregar más fotos</label><input id="morePhotos" type="file" accept="image/*" capture="environment" multiple></div><div class="modal-actions"><button class="btn soft" data-close>Cerrar</button></div>`);document.querySelectorAll('[data-photo]').forEach(img=>img.onclick=()=>showModal(`<h3>Recibo</h3><div class="photo-view"><img src="${img.src}" alt="Recibo ampliado"></div><div class="modal-actions"><button class="btn soft" data-close>Cerrar</button></div>`));document.querySelectorAll('[data-delphoto]').forEach(b=>b.onclick=async()=>{if(confirm('¿Seguro que deseas eliminar este recibo?')){t.receipts.splice(Number(b.dataset.delphoto),1);await save();showReceipts(id)}});$('#morePhotos').onchange=async ev=>{for(const f of ev.target.files)t.receipts.push(await fileToDataURL(f));await save();showReceipts(id)}}
function editEnvelope(e){showModal(`<h3>Editar sobre</h3><form id="envForm" class="form-grid"><div class="field"><label>Nombre</label><input name="name" value="${esc(e.name)}" required></div><div class="field"><label>Moneda principal</label><select name="currency"><option value="DOP" ${e.currency==='DOP'?'selected':''}>RD$</option><option value="USD" ${e.currency==='USD'?'selected':''}>US$</option></select></div><div class="field"><label>Cantidad que solicita en cada distribución</label><input name="request" type="number" min="0" step="0.01" value="${e.request}"></div><label><input name="priority" type="checkbox" ${e.priority?'checked':''}> Prioridad</label><div class="modal-actions"><button type="button" class="btn danger" id="deleteEnv">Eliminar</button><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn">Guardar</button></div></form>`);$('#envForm').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget);e.name=String(fd.get('name')).trim();e.currency=fd.get('currency');e.request=Math.max(0,Number(fd.get('request'))||0);e.priority=fd.get('priority')==='on';await save();$('#modal').close()};$('#deleteEnv').onclick=async()=>{if(confirm('¿Seguro que quieres eliminar este sobre? Su historial también dejará de mostrarse.')){state.envelopes=state.envelopes.filter(x=>x.id!==e.id);await save();$('#modal').close()}}}
function newEnvelope(){showModal(`<h3>Nuevo sobre</h3><form id="newEnv" class="form-grid"><div class="field"><label>Nombre</label><input name="name" required></div><div class="field"><label>Moneda principal</label><select name="currency"><option value="DOP">RD$</option><option value="USD">US$</option></select></div><div class="field"><label>Cantidad que solicitará</label><input name="request" type="number" min="0" step="0.01" value="0"></div><label><input name="priority" type="checkbox"> Prioridad</label><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn">Crear</button></div></form>`);$('#newEnv').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget);state.envelopes.push({id:uid(),name:String(fd.get('name')).trim(),currency:fd.get('currency'),request:Math.max(0,Number(fd.get('request'))||0),priority:fd.get('priority')==='on',balance:{DOP:0,USD:0},special:null});await save();$('#modal').close()}}
function addIncome(){showModal(`<h3>Agregar entrada</h3><form id="incomeForm" class="form-grid"><div class="field"><label>Monto</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Moneda</label><select name="currency"><option value="DOP">RD$</option><option value="USD">US$</option></select></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Descripción (opcional)</label><input name="note"></div><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn green">Agregar</button></div></form>`);$('#incomeForm').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),amount=Number(fd.get('amount')),currency=fd.get('currency'),id=uid(),date=String(fd.get('date'))+'T12:00:00.000Z',note=String(fd.get('note')||'');state.available[currency]+=amount;state.incomes.push({id,amount,currency,note,date});state.transactions.push({id:uid(),incomeId:id,accountType:'available',accountId:null,type:'add',amount,currency,note:'Entrada'+(note?' · '+note:''),date,receipts:[]});await save();$('#modal').close()}}
function canReverseDistributions(ds,incomeAmountDOP=0){const needs=new Map();let returned=0;for(const d of ds){returned+=Number(d.actualUsedDOP)||0;const t=state.envelopes.find(e=>e.special==='tithe'),o=state.envelopes.find(e=>e.special==='offering');needs.set(t.id,(needs.get(t.id)||0)+(Number(d.titheDOP)||0));needs.set(o.id,(needs.get(o.id)||0)+(Number(d.offeringDOP)||0));for(const a of d.allocations||[])needs.set(a.id,(needs.get(a.id)||0)+(Number(a.amountDOP)||0))}for(const [id,need] of needs){const e=state.envelopes.find(x=>x.id===id);if(!e||toDOP(e.balance)+0.005<need)return {ok:false,message:`No se puede revertir porque el sobre “${e?e.name:'eliminado'}” ya no tiene suficiente saldo. Primero devuelve el dinero usado a ese sobre.`}}if(toDOP(state.available)+returned+0.005<incomeAmountDOP)return {ok:false,message:'No se puede eliminar o editar esta entrada porque parte del dinero disponible ya fue gastado. Primero devuelve ese dinero a Disponible.'};return {ok:true}}
function removeDistributionTransactions(d){state.transactions=state.transactions.filter(t=>{if(t.distributionId===d.id)return false;if(t.date!==d.date)return true;const n=String(t.note||'');return !(n===`Diezmo · ${d.name}`||n===`Ofrenda · ${d.name}`||n.startsWith(`Distribución · ${d.name}`))})}
function reverseDistributionNoSave(d){const tithe=state.envelopes.find(e=>e.special==='tithe'),offering=state.envelopes.find(e=>e.special==='offering');withdrawEquivalent(tithe.balance,Number(d.titheDOP)||0,'DOP');withdrawEquivalent(offering.balance,Number(d.offeringDOP)||0,'DOP');for(const a of d.allocations||[]){if((Number(a.amountDOP)||0)<=0)continue;const e=state.envelopes.find(x=>x.id===a.id);if(e){const rate=Number(d.rateAtDistribution)||state.rate;withdrawEquivalent(e.balance,a.currency==='USD'?(Number(a.amountDOP)||0)/rate:(Number(a.amountDOP)||0),a.currency||'DOP')}}state.available.DOP=(state.available.DOP||0)+(Number(d.actualUsedDOP)||0);removeDistributionTransactions(d);state.distributions=state.distributions.filter(x=>x.id!==d.id)}
function findIncomeTransaction(i){return state.transactions.find(t=>t.incomeId===i.id)||state.transactions.find(t=>t.accountType==='available'&&t.type==='add'&&t.date===i.date&&Number(t.amount)===Number(i.amount)&&t.currency===i.currency&&String(t.note||'').startsWith('Entrada'))}
async function deleteIncome(id){const i=state.incomes.find(x=>x.id===id);if(!i)return;const ds=incomeDistributions(id),msg=ds.length?'Esta acción eliminará la entrada y revertirá toda la distribución asociada, incluyendo Diezmo, Ofrenda, sobres y Disponible. ¿Deseas continuar?':'¿Seguro que deseas eliminar esta entrada?';if(!confirm(msg))return;const check=canReverseDistributions(ds,incomeDOP(i));if(!check.ok){alert(check.message);return}for(const d of [...ds])reverseDistributionNoSave(d);withdrawEquivalent(state.available,i.amount,i.currency);const tx=findIncomeTransaction(i);if(tx)state.transactions=state.transactions.filter(t=>t.id!==tx.id);state.incomes=state.incomes.filter(x=>x.id!==id);await save()}
function editIncome(id){const i=state.incomes.find(x=>x.id===id);if(!i)return;showModal(`<h3>Editar entrada</h3><form id="editIncomeForm" class="form-grid"><div class="field"><label>Monto</label><input name="amount" type="number" min="0.01" step="0.01" value="${Number(i.amount)}" required></div><div class="field"><label>Moneda</label><select name="currency"><option value="DOP" ${i.currency==='DOP'?'selected':''}>RD$</option><option value="USD" ${i.currency==='USD'?'selected':''}>US$</option></select></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${i.date.slice(0,10)}" required></div><div class="field"><label>Descripción (opcional)</label><input name="note" value="${esc(i.note||'')}"></div><p class="muted">Si esta entrada ya fue distribuida, al guardar se revertirá esa distribución y la entrada quedará 🟡 Pendiente de distribuir.</p><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn green">Guardar cambios</button></div></form>`);$('#editIncomeForm').onsubmit=async ev=>{ev.preventDefault();const ds=incomeDistributions(id);if(ds.length&&!confirm('Esta entrada ya fue distribuida. Al editarla se revertirá la distribución anterior y quedará pendiente de distribuir. ¿Deseas continuar?'))return;const check=canReverseDistributions(ds,incomeDOP(i));if(!check.ok){alert(check.message);return}for(const d of [...ds])reverseDistributionNoSave(d);withdrawEquivalent(state.available,i.amount,i.currency);const fd=new FormData(ev.currentTarget),newAmount=Number(fd.get('amount')),newCurrency=fd.get('currency'),newDate=String(fd.get('date'))+'T12:00:00.000Z',newNote=String(fd.get('note')||'');applyAmount(state.available,newAmount,newCurrency,1);const tx=findIncomeTransaction(i);i.amount=newAmount;i.currency=newCurrency;i.date=newDate;i.note=newNote;if(tx){tx.incomeId=i.id;tx.amount=newAmount;tx.currency=newCurrency;tx.date=newDate;tx.note='Entrada'+(newNote?' · '+newNote:'')}else state.transactions.push({id:uid(),incomeId:i.id,accountType:'available',accountId:null,type:'add',amount:newAmount,currency:newCurrency,note:'Entrada'+(newNote?' · '+newNote:''),date:newDate,receipts:[]});await save();$('#modal').close()}}

function distribute(){const availDOP=toDOP(state.available);if(availDOP<=0){alert('No hay dinero disponible para distribuir.');return}showModal(`<h3>Nueva distribución</h3><form id="distStart" class="form-grid"><div class="field"><label>Nombre de la distribución</label><input name="name" placeholder="Ej. Pago del 25" required></div><div class="field"><label>Monto a distribuir</label><input name="amount" type="number" min="0.01" step="0.01" value="${availDOP.toFixed(2)}" required></div><div class="field"><label>Moneda del monto</label><select name="currency"><option value="DOP">RD$</option><option value="USD">US$</option></select></div><p class="muted">Disponible total equivalente: ${eqPair(state.available)}</p><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn gold">Vista previa</button></div></form>`);$('#distStart').onsubmit=ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),amount=Number(fd.get('amount')),currency=fd.get('currency'),baseDOP=currency==='DOP'?amount:amount*state.rate;if(baseDOP>availDOP+1e-9){alert('El monto supera el dinero disponible.');return}previewDistribution(String(fd.get('name')).trim(),baseDOP)}}
function previewDistribution(name,baseDOP){const tithe=baseDOP*.10,offering=baseDOP*.05,remaining=baseDOP*.85;let left=remaining;const normal=state.envelopes.filter(e=>!e.special).sort((a,b)=>(b.priority-a.priority)||a.name.localeCompare(b.name,'es'));const allocations=[];for(const e of normal){const req=e.currency==='DOP'?e.request:e.request*state.rate,got=Math.min(req,left);allocations.push({id:e.id,name:e.name,requestDOP:req,amountDOP:got,currency:e.currency});left-=got;if(left<1e-9)left=0}const need=normal.reduce((s,e)=>s+(e.currency==='DOP'?e.request:e.request*state.rate),0),balance=remaining-need,allocated=allocations.reduce((sum,a)=>sum+a.amountDOP,0),actualUsed=tithe+offering+allocated;showModal(`<h3>Vista previa</h3><div class="preview"><div class="preview-line"><b>Distribución</b><span>${esc(name)}</span></div><div class="preview-line"><b>Monto</b><span>${fmt(baseDOP,'DOP')}</span></div><div class="preview-line"><b>Diezmo 10%</b><span>${fmt(tithe,'DOP')}</span></div><div class="preview-line"><b>Ofrenda 5%</b><span>${fmt(offering,'DOP')}</span></div><div class="preview-line"><b>Disponible para sobres</b><span>${fmt(remaining,'DOP')}</span></div>${allocations.map(a=>`<div class="preview-line"><span>${esc(a.name)}</span><span>${fmt(a.amountDOP,'DOP')} <small>(${fmt(a.amountDOP/state.rate,'USD')})</small></span></div>`).join('')}<div class="preview-line"><b>Total que se usará</b><b>${fmt(actualUsed,'DOP')}</b></div><div class="preview-line"><b>${balance<0?'Faltante para cubrir solicitudes':'Sobrante que queda Disponible'}</b><b class="${balance<0?'red':'green'}">${fmt(balance<0?balance:left,'DOP')}</b></div></div><div class="modal-actions"><button class="btn soft" data-close>Cancelar</button><button class="btn green" id="confirmDist">Confirmar distribución</button></div>`);$('#confirmDist').onclick=()=>commitDistribution({name,baseDOP,tithe,offering,remaining,allocations,balance,leftover:left,actualUsed})}
function subtractAvailableDOP(dop){let need=dop;const dTake=Math.min(state.available.DOP,need);state.available.DOP-=dTake;need-=dTake;if(need>1e-9){const usd=need/state.rate;state.available.USD-=usd;if(Math.abs(state.available.USD)<1e-9)state.available.USD=0}}
async function commitDistribution(p){const allocated=p.allocations.reduce((sum,a)=>sum+a.amountDOP,0),actualUsed=p.actualUsed??(p.tithe+p.offering+allocated),leftover=Math.max(0,p.baseDOP-actualUsed),distId=uid(),sourceUses=sourceUsesForDistribution(actualUsed);subtractAvailableDOP(actualUsed);const titheEnv=state.envelopes.find(e=>e.special==='tithe'),offEnv=state.envelopes.find(e=>e.special==='offering');titheEnv.balance.DOP+=p.tithe;offEnv.balance.DOP+=p.offering;const txDate=now();state.transactions.push({id:uid(),distributionId:distId,accountType:'envelope',accountId:titheEnv.id,type:'add',amount:p.tithe,currency:'DOP',note:'Diezmo · '+p.name,date:txDate,receipts:[]},{id:uid(),distributionId:distId,accountType:'envelope',accountId:offEnv.id,type:'add',amount:p.offering,currency:'DOP',note:'Ofrenda · '+p.name,date:txDate,receipts:[]});for(const a of p.allocations){if(a.amountDOP<=0)continue;const e=state.envelopes.find(x=>x.id===a.id),amt=a.currency==='DOP'?a.amountDOP:a.amountDOP/state.rate;e.balance[a.currency]+=amt;state.transactions.push({id:uid(),distributionId:distId,accountType:'envelope',accountId:e.id,type:'add',amount:amt,currency:a.currency,note:'Distribución · '+p.name,date:txDate,receipts:[]})}state.transactions.push({id:uid(),distributionId:distId,accountType:'available',accountId:null,type:'expense',amount:actualUsed,currency:'DOP',note:'Distribución · '+p.name+(leftover>0.005?' · sobrante permanece Disponible':''),date:txDate,receipts:[]});state.distributions.push({id:distId,name:p.name,date:txDate,baseDOP:p.baseDOP,titheDOP:p.tithe,offeringDOP:p.offering,remainingDOP:p.remaining,balanceDOP:p.balance,leftoverDOP:leftover,actualUsedDOP:actualUsed,allocations:p.allocations,sourceUses,rateAtDistribution:state.rate});await save();$('#modal').close()}
function showDistribution(id){const d=state.distributions.find(x=>x.id===id),leftover=Number(d.leftoverDOP)||0;showModal(`<h3>${esc(d.name)}</h3><div class="preview"><div class="preview-line"><b>Fecha</b><span>${d.date.slice(0,10)}</span></div><div class="preview-line"><b>Monto</b><span>${fmt(d.baseDOP,'DOP')}</span></div><div class="preview-line"><b>Diezmo</b><span>${fmt(d.titheDOP,'DOP')}</span></div><div class="preview-line"><b>Ofrenda</b><span>${fmt(d.offeringDOP,'DOP')}</span></div>${d.allocations.map(a=>`<div class="preview-line"><span>${esc(a.name)}</span><span>${fmt(a.amountDOP,'DOP')}</span></div>`).join('')}${d.balanceDOP<0?`<div class="preview-line"><b>Faltante para cubrir solicitudes</b><b class="red">${fmt(d.balanceDOP,'DOP')}</b></div>`:`<div class="preview-line"><b>Sobrante que quedó Disponible</b><b class="green">${fmt(leftover,'DOP')}</b></div>`}</div><div class="modal-actions"><button class="btn soft" data-close>Cerrar</button></div>`)}
function transfer(){const accounts=[{key:'available',label:'Disponible'},...state.envelopes.map(e=>({key:e.id,label:e.name}))];showModal(`<h3>Transferir dinero</h3><form id="transferForm" class="form-grid"><div class="field"><label>Desde</label><select name="from">${accounts.map(a=>`<option value="${a.key}">${esc(a.label)}</option>`).join('')}</select></div><div class="field"><label>Hacia</label><select name="to">${accounts.map(a=>`<option value="${a.key}">${esc(a.label)}</option>`).join('')}</select></div><div class="field"><label>Monto</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Moneda</label><select name="currency"><option value="DOP">RD$</option><option value="USD">US$</option></select></div><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn">Transferir</button></div></form>`);$('#transferForm').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),from=fd.get('from'),to=fd.get('to'),amount=Number(fd.get('amount')),currency=fd.get('currency');if(from===to){alert('El origen y destino deben ser diferentes.');return}const fromHolder=from==='available'?state.available:state.envelopes.find(e=>e.id===from).balance,toHolder=to==='available'?state.available:state.envelopes.find(e=>e.id===to).balance;const dop=currency==='DOP'?amount:amount*state.rate;if(toDOP(fromHolder)<dop-1e-9){alert('No hay saldo suficiente.');return}withdrawEquivalent(fromHolder,amount,currency);applyAmount(toHolder,amount,currency,1);const date=now(),fromName=from==='available'?'Disponible':state.envelopes.find(e=>e.id===from).name,toName=to==='available'?'Disponible':state.envelopes.find(e=>e.id===to).name;state.transactions.push({id:uid(),accountType:from==='available'?'available':'envelope',accountId:from==='available'?null:from,type:'expense',amount,currency,note:`Transferencia a ${toName}`,date,receipts:[]},{id:uid(),accountType:to==='available'?'available':'envelope',accountId:to==='available'?null:to,type:'add',amount,currency,note:`Transferencia desde ${fromName}`,date,receipts:[]});await save();$('#modal').close()}}
async function backup(){const blob=new Blob([JSON.stringify({version:1,exportedAt:now(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mis-sobres-respaldo-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
async function restore(ev){const f=ev.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data.state||!Array.isArray(data.state.envelopes))throw Error();if(confirm('Esto reemplazará los datos actuales. ¿Deseas continuar?')){state=data.state;ensureSpecial();await save();alert('Respaldo restaurado correctamente.')}}catch{alert('El archivo de respaldo no es válido.')}ev.target.value=''}
$('#tabs').onclick=e=>{const b=e.target.closest('[data-view]');if(b){currentView=b.dataset.view;render()}};$('#addIncomeBtn').onclick=addIncome;$('#addEnvelopeBtn').onclick=newEnvelope;$('#distributeBtn').onclick=distribute;$('#transferBtn').onclick=transfer;$('#quickExpenseBtn').onclick=()=>{currentView='available';render();moneyModal('available',null,'expense')};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');load();
</script>
</body></html>
