function usaState(){state.usa=state.usa||{};const u=state.usa;u.availableUSD=Number(u.availableUSD)||0;u.incomes=Array.isArray(u.incomes)?u.incomes:[];u.payments=Array.isArray(u.payments)?u.payments:[];u.paymentTransactions=Array.isArray(u.paymentTransactions)?u.paymentTransactions:[];u.transactions=Array.isArray(u.transactions)?u.transactions:[];u.remittances=Array.isArray(u.remittances)?u.remittances:[];u.churchTransfers=Array.isArray(u.churchTransfers)?u.churchTransfers:[];return u}
function usaIncomeTotal(i){return (i.parts||[]).reduce((s,p)=>s+(Number(p.amount)||0),0)}
function usaDuePayments(){const end=monthEndISO();return usaState().payments.filter(p=>p.active!==false&&p.dueDate&&String(p.dueDate)<=end)}
function usaPaymentTypeLabel(p){return paymentTypeLabel(p)}
function usaPaymentScheduleLabel(p){return paymentScheduleLabel(p)}
function usaNextDue(p,current){return nextPaymentDueDate(p,current)}
function usaIncomeCommitted(i){const u=usaState(),id=i.id;return u.transactions.filter(t=>t.incomeId===id&&['expense','payment','church','remittance'].includes(t.kind)).reduce((s,t)=>s+(Number(t.amountUSD)||0),0)}
function usaIncomeTrace(i){const u=usaState(),id=i.id;const spent=u.transactions.filter(t=>t.incomeId===id&&['expense','payment'].includes(t.kind)).reduce((s,t)=>s+(Number(t.amountUSD)||0),0),sent=u.transactions.filter(t=>t.incomeId===id&&t.kind==='remittance').reduce((s,t)=>s+(Number(t.amountUSD)||0),0),church=u.transactions.filter(t=>t.incomeId===id&&t.kind==='church').reduce((s,t)=>s+(Number(t.amountUSD)||0),0);return {spent,sent,church,remaining:Math.max(0,usaIncomeTotal(i)-spent-sent-church)}}
function usaAllocateSource(amountUSD,kind,refId,note){let need=Number(amountUSD)||0;const u=usaState(),links=[];for(const i of u.incomes.filter(x=>x.complete).sort((a,b)=>String(a.date).localeCompare(String(b.date)))){const left=Math.max(0,usaIncomeTotal(i)-usaIncomeCommitted(i)),use=Math.min(left,need);if(use>0.005){u.transactions.push({id:uid(),incomeId:i.id,kind,refId,amountUSD:use,note,date:now()});links.push({incomeId:i.id,amountUSD:use});need-=use}if(need<=0.005)break}if(need>0.005)u.transactions.push({id:uid(),incomeId:null,kind,refId,amountUSD:need,note,date:now()});return links}
function usaReverseRef(refId){const u=usaState();u.transactions=u.transactions.filter(t=>t.refId!==refId)}
function renderUsaHistoryFull(){const root=$('#usaHistoryFull');if(!root)return;const q=String($('#usaHistorySearch')?.value||'').toLowerCase().trim(),f=$('#usaHistoryFilter')?.value||'all';const tx=[...(usaState().transactions||[])].sort((a,b)=>new Date(b.date)-new Date(a.date)).filter(t=>{const type=String(t.type||'');const hay=(String(t.note||'')+' '+String(t.amount||'')+' '+type).toLowerCase();const matchQ=!q||hay.includes(q);const mapType=type==='income'?'income':type==='expense'?'expense':type==='payment'?'payment':type==='transfer'?'transfer':type;const matchF=f==='all'||mapType===f;return matchQ&&matchF});root.innerHTML=tx.length?tx.map(t=>`<div class="history-row"><div><strong>${t.type==='income'?'+':t.type==='expense'?'-':''}${moneyUSD(Math.abs(Number(t.amount)||0))}</strong><div class="muted">${fmtDate(t.date)} · ${esc(t.note||'')}</div></div></div>`).join(''):'<div class="empty">No hay movimientos que coincidan.</div>'}function renderUSAHistory(){const u=usaState();$('#view').innerHTML=`<div class="section-title"><div><h2>Historial USA</h2><div class="muted">Todos los movimientos de Estados Unidos</div></div></div><div class="actions" style="margin-bottom:12px"><button type="button" class="btn soft" id="usaHistoryBack">← Volver a Estados Unidos</button></div><div class="toolbar" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px"><input id="usaHistorySearch" class="searchbox" style="margin:0" type="search" placeholder="Buscar por descripción o monto..."><select id="usaHistoryFilter"><option value="all">Todos</option><option value="income">Ingresos</option><option value="expense">Gastos</option><option value="payment">Pagos</option><option value="transfer">Envíos a RD</option></select></div><div id="usaHistoryFull" style="margin-top:12px"></div>`;$('#usaHistoryBack').onclick=()=>{currentView='usa';render()};const refresh=()=>{const q=$('#usaHistorySearch').value.trim().toLowerCase(),f=$('#usaHistoryFilter').value;const rows=[...(u.transactions||[])].sort((a,b)=>new Date(b.date)-new Date(a.date)).filter(t=>{const type=String(t.type||'');const mapped=type==='income'?'income':type==='expense'?'expense':type==='payment'?'payment':type==='transfer'?'transfer':type;const hay=(String(t.note||'')+' '+String(t.amount||'')+' '+mapped).toLowerCase();return(!q||hay.includes(q))&&(f==='all'||mapped===f)});$('#usaHistoryFull').innerHTML=rows.length?`<div class="card">${rows.map(t=>`<div class="history-row"><div><strong class="${t.type==='expense'||t.type==='transfer'?'red':''}">${t.type==='income'?'+':t.type==='expense'||t.type==='transfer'?'-':''}${fmt(Math.abs(Number(t.amount)||0),'USD')}</strong><div class="muted">${dateDO(new Date(t.date))} · ${esc(t.note||'')}</div></div></div>`).join('')}</div>`:'<div class="card empty">No hay movimientos que coincidan.</div>'};$('#usaHistorySearch').oninput=refresh;$('#usaHistoryFilter').onchange=refresh;refresh()}function renderUSA(){const u=usaState(),lastRate=Number(u.remittances?.at(-1)?.rate)||state.rate,inc=[...u.incomes],pays=[...u.payments].sort((a,b)=>String(a.dueDate||'9999').localeCompare(String(b.dueDate||'9999')));$('#view').innerHTML=`<div class="section-title"><h2>Estados Unidos</h2></div><div class="grid stats" style="margin-bottom:12px"><div class="card stat"><small>Disponible USA</small><strong>${fmt(u.availableUSD,'USD')}</strong><span class="submoney">${fmt(u.availableUSD*lastRate,'DOP')} con última tasa</span></div><div class="card stat"><small>Pagos USA pendientes</small><strong>${usaDuePayments().length}</strong><span class="submoney">${fmt(usaDuePayments().reduce((s,p)=>s+Number(p.amount||0),0),'USD')}</span></div><div class="card stat"><small>Ingresos USA</small><strong>${inc.length}</strong><span class="submoney">registrados</span></div></div><div class="actions"><button class="btn green" id="usaNewIncome">+ Ingreso USA</button><button class="btn soft" id="usaViewIncomes">Ver Ingresos USA</button><button class="btn soft" id="usaExpense">− Gasto imprevisto</button><button class="btn gold" id="usaSendRD">Enviar a RD</button><button class="btn soft" id="usaNewPayment">+ Pago USA</button></div><div class="section-title" style="margin-top:18px"><h2>Pagos USA</h2></div><div class="toolbar" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px"><input id="usaPaySearch" class="searchbox" style="margin:0" type="search" placeholder="Buscar pago USA..."><select id="usaPayFilter"><option value="all">Todos</option><option value="monthly">Mensuales</option><option value="annual">Anuales</option><option value="once">Una sola vez</option></select></div>${pays.length?`<div class="grid" style="margin-top:12px">${pays.map(p=>`<article class="card monthly-card" data-upay-search="${esc(String(p.name).toLowerCase())}" data-upay-type="${p.paymentType||'monthly'}"><h3>${esc(p.name)}</h3><div class="money">${fmt(p.amount,'USD')}</div><div class="submoney">${p.active!==false&&p.dueDate?'Próximo: '+dateDO(parseLocalDate(p.dueDate)):'Completado'} · ${usaPaymentTypeLabel(p)} · ${usaPaymentScheduleLabel(p)}${p.note?' · '+esc(p.note):''}</div><div class="row-actions">${p.active!==false?`<button class="mini" data-upay-act="pay" data-id="${p.id}">Pagar</button>`:''}<button class="mini" data-upay-act="history" data-id="${p.id}">Historial</button><button class="mini" data-upay-act="edit" data-id="${p.id}">Editar</button><button type="button" class="mini" data-upay-act="delete" data-id="${p.id}" style="color:var(--danger)">Eliminar</button></div></article>`).join('')}</div>`:'<div class="card empty" style="margin-top:12px">No hay pagos USA todavía.</div>'}<div class="section-title" style="margin-top:18px"><h2>Historial USA</h2></div><div class="card"><div class="section-head"><div><strong>Movimientos de Estados Unidos</strong><div class="muted">Consulta ingresos, gastos, pagos y envíos cuando lo necesites.</div></div><button type="button" class="btn soft" id="usaViewHistory">Ver Historial USA</button></div></div>`;$('#usaNewIncome').onclick=()=>usaNewIncome();$('#usaViewIncomes').onclick=()=>{currentView='usaIncomes';render()};$('#usaViewHistory').onclick=()=>{currentView='usaHistory';render()};$('#usaExpense').onclick=usaExpense;$('#usaSendRD').onclick=usaSendRD;$('#usaNewPayment').onclick=()=>usaEditPayment();document.querySelectorAll('[data-upay-act]').forEach(b=>b.onclick=()=>usaPaymentAction(b.dataset.upayAct,b.dataset.id));const f=()=>{const q=$('#usaPaySearch').value.trim().toLowerCase(),ty=$('#usaPayFilter').value;document.querySelectorAll('[data-upay-search]').forEach(el=>el.style.display=(!q||el.dataset.upaySearch.includes(q))&&(ty==='all'||el.dataset.upayType===ty)?'':'none')};$('#usaPaySearch').oninput=f;$('#usaPayFilter').onchange=f;document.querySelectorAll('[data-uremit-edit]').forEach(b=>b.onclick=()=>{const r=usaState().remittances.find(x=>x.id===b.dataset.uremitEdit);if(r)usaEditRemittance(r)});document.querySelectorAll('[data-uremit-del]').forEach(b=>b.onclick=()=>{const r=usaState().remittances.find(x=>x.id===b.dataset.uremitDel);if(r)usaDeleteRemittance(r)});document.querySelectorAll('[data-uexp-edit]').forEach(b=>b.onclick=()=>usaEditExpense(b.dataset.uexpEdit));document.querySelectorAll('[data-uexp-del]').forEach(b=>b.onclick=()=>usaDeleteExpense(b.dataset.uexpDel))}
function renderUSAIncomes(){const inc=[...usaState().incomes].sort((a,b)=>String(b.date).localeCompare(String(a.date)));$('#view').innerHTML=`<div class="section-title"><h2>Ingresos USA</h2><button class="btn soft" id="usaIncomeBack">← Estados Unidos</button></div><div class="actions"><button class="btn green" id="usaIncomeNew">+ Ingreso USA</button></div><div class="toolbar" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:12px"><input id="usaIncomeSearch" class="searchbox" style="margin:0" type="search" placeholder="Buscar ingreso USA por nombre..."><select id="usaIncomeFilter"><option value="all">Todos</option><option value="complete">Completos</option><option value="progress">En proceso</option></select></div><div id="usaIncomeResults" class="grid" style="margin-top:12px">${inc.length?inc.map(i=>{const total=usaIncomeTotal(i),tr=usaIncomeTrace(i);return `<article class="card" data-uinc-search="${esc(String(i.name||'').toLowerCase())}" data-uinc-status="${i.complete?'complete':'progress'}"><div class="monthly-top"><div><h3>${esc(i.name||'Ingreso USA')}</h3><div class="money">${fmt(total,'USD')}</div><div class="submoney">${String(i.date||'').slice(0,10)} · ${i.complete?'🟢 Ingreso completo':'🟡 En proceso'}${i.note?' · '+esc(i.note):''}</div></div><span class="pill">${(i.parts||[]).length} parte(s)</span></div>${i.complete?`<div class="submoney">Usado USA: ${fmt(tr.spent,'USD')} · Enviado RD: ${fmt(tr.sent,'USD')} · Restante atribuible: ${fmt(tr.remaining,'USD')}</div>`:''}<div class="row-actions"><button class="mini" data-usa-income="parts" data-id="${i.id}">Partes</button>${!i.complete?`<button class="mini" data-usa-income="complete" data-id="${i.id}">Ingreso completo</button>`:''}<button class="mini" data-usa-income="edit" data-id="${i.id}">Editar</button><button type="button" class="mini" data-usa-income="delete" data-id="${i.id}" style="color:var(--danger)">Eliminar</button></div></article>`}).join(''):'<div class="card empty">No hay ingresos USA todavía.</div>'}</div>`;$('#usaIncomeBack').onclick=()=>{currentView='usa';render()};$('#usaIncomeNew').onclick=()=>usaNewIncome();document.querySelectorAll('[data-usa-income]').forEach(b=>b.onclick=()=>usaIncomeAction(b.dataset.usaIncome,b.dataset.id));const filter=()=>{const q=$('#usaIncomeSearch').value.trim().toLowerCase(),st=$('#usaIncomeFilter').value;document.querySelectorAll('[data-uinc-search]').forEach(el=>el.style.display=(!q||el.dataset.uincSearch.includes(q))&&(st==='all'||el.dataset.uincStatus===st)?'':'none')};$('#usaIncomeSearch').oninput=filter;$('#usaIncomeFilter').onchange=filter}
function usaHistoryHTML(){const u=usaState(),rows=[...u.remittances.map(x=>({...x,_type:'remit'})),...u.transactions.filter(t=>t.kind==='expense'&&t.id===t.refId).map(x=>({...x,_type:'expense'}))].sort((a,b)=>String(b.date).localeCompare(String(a.date)));return rows.length?`<div class="card">${rows.map(x=>`<div class="history-item"><div><strong>${x._type==='remit'?'🇩🇴 Envío a RD':'− Gasto USA'}</strong><span class="muted">${String(x.date).slice(0,10)} · ${x._type==='remit'?fmt(x.amountUSD,'USD')+' → '+fmt(x.amountDOP,'DOP')+' · tasa '+Number(x.rate).toFixed(2):fmt(x.amountUSD,'USD')}${x.note?' · '+esc(x.note):''}</span></div>${x._type==='remit'?`<div class="row-actions"><button class="mini" data-uremit-edit="${x.id}">Editar</button><button type="button" class="mini" data-uremit-del="${x.id}" style="color:var(--danger)">Eliminar</button></div>`:`<div class="row-actions"><button class="mini" data-uexp-edit="${x.id}">Editar</button><button type="button" class="mini" data-uexp-del="${x.id}" style="color:var(--danger)">Eliminar</button></div>`}</div>`).join('')}</div>`:'<div class="card empty">Todavía no hay movimientos USA.</div>'}
function usaNewIncome(existing=null){const i=existing;showModal(`<h3>${i?'Editar':'Nuevo'} Ingreso USA</h3><form id="usaIncomeForm" class="form-grid"><div class="field"><label>Nombre</label><input name="name" value="${esc(i?.name||'')}" required></div>${!i?`<div class="field"><label>Monto recibido US$</label><input name="initialAmount" type="number" min="0.01" step="0.01" required></div>`:''}<div class="field"><label>Fecha</label><input name="date" type="date" value="${String(i?.date||today()).slice(0,10)}" required></div><div class="field"><label>Descripción (opcional)</label><input name="note" value="${esc(i?.note||'')}"></div><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn green">Guardar</button></div></form>`);$('#usaIncomeForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget);if(i&&i.complete&&usaIncomeCommitted(i)>0.005){if(!confirm('Este ingreso ya tiene movimientos vinculados. Editarlo puede requerir revertir envíos o pagos. ¿Continuar?'))return;i.complete=false}const obj=i||{id:uid(),parts:[],complete:false};obj.name=String(fd.get('name')||'').trim();obj.date=String(fd.get('date'))+'T12:00:00.000Z';obj.note=String(fd.get('note')||'');delete obj.applyTithe;delete obj.applyOffering;delete obj.offeringRateAtComplete;delete obj.churchSent;delete obj.churchTransferId;if(!i){const initialAmount=Number(fd.get('initialAmount'));if(!(initialAmount>0)){alert('Escribe un monto recibido válido.');return}obj.parts=[{id:uid(),amount:initialAmount,date:obj.date,note:'Monto inicial'}];usaState().availableUSD+=initialAmount;usaState().transactions.push({id:uid(),type:'income',amount:initialAmount,date:obj.date,note:'Ingreso USA · '+obj.name,incomeId:obj.id});usaState().incomes.push(obj)}await save();$('#modal').close()}}
function usaIncomeParts(i){showModal(`<h3>Partes · ${esc(i.name)}</h3><div class="card"><strong>Total recibido: ${fmt(usaIncomeTotal(i),'USD')}</strong></div><form id="usaPartForm" class="form-grid" style="margin-top:10px"><div class="field"><label>Monto recibido</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Nota (opcional)</label><input name="note"></div><button class="btn green">Agregar parte</button></form><div class="card" style="margin-top:10px">${(i.parts||[]).length?(i.parts||[]).map(p=>`<div class="history-item"><div><strong>${fmt(p.amount,'USD')}</strong><span class="muted">${String(p.date).slice(0,10)}${p.note?' · '+esc(p.note):''}</span></div><div class="row-actions"><button class="mini" data-upart-edit="${p.id}">Editar</button><button type="button" class="mini" data-upart-del="${p.id}" style="color:var(--danger)">Eliminar</button></div></div>`).join(''):'Sin partes todavía.'}</div><div class="modal-actions"><button class="btn soft" data-close>Listo</button></div>`);$('#usaPartForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),amount=Number(fd.get('amount'));if(!(amount>0))return;if(i.complete){i.complete=false}i.parts=i.parts||[];i.parts.push({id:uid(),amount,date:String(fd.get('date'))+'T12:00:00.000Z',note:String(fd.get('note')||'')});const u=usaState();u.availableUSD+=amount;await save();usaIncomeParts(i)};document.querySelectorAll('[data-upart-del]').forEach(b=>b.onclick=async()=>{const part=i.parts.find(x=>x.id===b.dataset.upartDel);if(!part)return;if(!confirm('¿Eliminar esta parte del ingreso?'))return;i.parts=i.parts.filter(x=>x.id!==part.id);usaState().availableUSD-=Number(part.amount)||0;i.complete=false;await save();usaIncomeParts(i)});document.querySelectorAll('[data-upart-edit]').forEach(b=>b.onclick=()=>{const part=i.parts.find(x=>x.id===b.dataset.upartEdit);if(!part)return;const v=prompt('Nuevo monto US$',String(part.amount));if(v===null)return;const n=Number(v);if(!(n>0))return alert('Monto inválido.');usaState().availableUSD+=n-Number(part.amount||0);part.amount=n;i.complete=false;save().then(()=>usaIncomeParts(i))})}
function usaIncomeAction(act,id){const i=usaState().incomes.find(x=>x.id===id);if(!i)return;if(act==='parts')return usaIncomeParts(i);if(act==='edit')return usaNewIncome(i);if(act==='complete'){i.complete=true;return save()}if(act==='delete')return usaDeleteIncome(i)}
async function usaDeleteIncome(i){const tr=usaIncomeTrace(i),summary=`Se revertirá lo vinculado a este ingreso.\nUsado en USA: ${fmt(tr.spent,'USD')}\nEnviado a RD: ${fmt(tr.sent,'USD')}\n\n¿Deseas continuar?`;if(!confirm(summary))return;const u=usaState();const remits=u.remittances.filter(r=>(r.sourceLinks||[]).some(l=>l.incomeId===i.id));for(const r of remits){if(!usaRemoveLinkedRDIncome(r))return}const legacyChurch=u.churchTransfers.filter(c=>(c.sourceLinks||[]).some(l=>l.incomeId===i.id));for(const c of legacyChurch)usaReverseChurchTransfer(c);u.remittances=u.remittances.filter(r=>!remits.includes(r));u.churchTransfers=u.churchTransfers.filter(c=>!legacyChurch.includes(c));u.availableUSD-=Math.max(0,usaIncomeTotal(i)-tr.sent-tr.church-tr.spent);u.transactions=u.transactions.filter(t=>t.incomeId!==i.id);u.incomes=u.incomes.filter(x=>x.id!==i.id);await save()}
function usaExpense(){const u=usaState();showModal(`<h3>Gasto imprevisto USA</h3><form id="usaExpenseForm" class="form-grid"><div class="field"><label>Monto US$</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Descripción (opcional)</label><input name="note"></div><div class="modal-actions"><button class="btn soft" type="button" data-close>Cancelar</button><button class="btn danger">Registrar</button></div></form>`);$('#usaExpenseForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),amount=Number(fd.get('amount'));u.availableUSD-=amount;const id=uid();usaAllocateSource(amount,'expense',id,String(fd.get('note')||''));u.transactions.push({id,kind:'expense',refId:id,amountUSD:amount,date:String(fd.get('date'))+'T12:00:00.000Z',note:String(fd.get('note')||'')});await save();$('#modal').close()}}

function usaEditExpense(id){const u=usaState(),x=u.transactions.find(t=>t.id===id&&t.kind==='expense'&&t.refId===t.id);if(!x)return;showModal(`<h3>Editar gasto USA</h3><form id="usaExpenseEdit" class="form-grid"><div class="field"><label>Monto US$</label><input name="amount" type="number" min="0.01" step="0.01" value="${Number(x.amountUSD)}" required></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${String(x.date).slice(0,10)}" required></div><div class="field"><label>Descripción</label><input name="note" value="${esc(x.note||'')}"></div><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn">Guardar</button></div></form>`);$('#usaExpenseEdit').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),n=Number(fd.get('amount'));u.availableUSD+=Number(x.amountUSD)-n;usaReverseRef(x.id);x.amountUSD=n;x.date=String(fd.get('date'))+'T12:00:00.000Z';x.note=String(fd.get('note')||'');usaAllocateSource(n,'expense',x.id,x.note);u.transactions.push(x);await save();$('#modal').close()}}
async function usaDeleteExpense(id){const u=usaState(),x=u.transactions.find(t=>t.id===id&&t.kind==='expense'&&t.refId===t.id);if(!x||!confirm('¿Eliminar este gasto USA? El dinero volverá a Disponible USA.'))return;u.availableUSD+=Number(x.amountUSD)||0;usaReverseRef(x.id);await save()}
function usaEditPayment(p=null){const u=usaState(),type=p?.paymentType||'monthly';showModal(`<h3>${p?'Editar':'Nuevo'} Pago USA</h3><form id="usaPaymentForm" class="form-grid"><div class="field"><label>Nombre</label><input name="name" value="${esc(p?.name||'')}" required></div><div class="field"><label>Monto US$</label><input name="amount" type="number" min="0.01" step="0.01" value="${p?.amount||''}" required></div><div class="field"><label>Tipo</label><select name="paymentType"><option value="monthly" ${type==='monthly'?'selected':''}>Mensual</option><option value="annual" ${type==='annual'?'selected':''}>Anual</option><option value="once" ${type==='once'?'selected':''}>Una sola vez</option></select></div><div class="field"><label>Próxima fecha</label><input name="dueDate" type="date" value="${p?.dueDate||today()}" required></div><div class="field"><label>Días mensuales (separados por coma)</label><input name="dueDays" value="${esc((p?.dueDays||[Number(String(p?.dueDate||today()).slice(8,10))]).join(','))}"></div><div class="field"><label>Fechas anuales MM-DD (separadas por coma)</label><input name="annualDates" value="${esc((p?.annualDates||[]).join(','))}"></div><div class="field"><label>Nota (opcional)</label><input name="note" value="${esc(p?.note||'')}"></div><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn">Guardar</button></div></form>`);$('#usaPaymentForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),obj=p||{id:uid(),active:true};obj.name=String(fd.get('name')).trim();obj.amount=Number(fd.get('amount'));obj.currency='USD';obj.paymentType=String(fd.get('paymentType'));obj.dueDate=String(fd.get('dueDate'));obj.dueDays=normalizeDueDays(String(fd.get('dueDays')),String(obj.dueDate).slice(8,10));obj.billingDay=obj.dueDays[0];obj.annualDates=normalizeAnnualDates(String(fd.get('annualDates')));obj.note=String(fd.get('note')||'');if(!p)u.payments.push(obj);await save();$('#modal').close()}}
function usaPaymentAction(act,id){const u=usaState(),p=u.payments.find(x=>x.id===id);if(!p)return;if(act==='edit')return usaEditPayment(p);if(act==='pay')return usaPayPayment(p);if(act==='history')return usaPaymentHistory(p);if(act==='delete'){if(!confirm('¿Eliminar este pago USA y su configuración? Los pagos ya registrados permanecerán en el historial general.'))return;u.payments=u.payments.filter(x=>x.id!==id);return save()}}
function usaPayPayment(p){const u=usaState();showModal(`<h3>Pagar · ${esc(p.name)}</h3><form id="usaPayForm" class="form-grid"><div class="field"><label>Monto US$</label><input name="amount" type="number" min="0.01" step="0.01" value="${Number(p.amount).toFixed(2)}" required></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Nota (opcional)</label><input name="note" value="${esc(p.note||'')}"></div><p class="muted">El pago sale de Disponible USA. Se permite saldo negativo.</p><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn green">Pagar</button></div></form>`);$('#usaPayForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),amount=Number(fd.get('amount')),id=uid(),due=p.dueDate;u.availableUSD-=amount;usaAllocateSource(amount,'payment',id,p.name);u.paymentTransactions.push({id,paymentId:p.id,amountUSD:amount,date:String(fd.get('date'))+'T12:00:00.000Z',dueDatePaid:due,note:String(fd.get('note')||'')});if(p.paymentType==='once'){p.active=false;p.dueDate=''}else p.dueDate=usaNextDue(p,due);await save();$('#modal').close()}}
function usaPaymentHistory(p){const u=usaState(),tx=u.paymentTransactions.filter(t=>t.paymentId===p.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));showModal(`<h3>Historial · ${esc(p.name)}</h3>${tx.length?tx.map(t=>`<div class="history-item"><div><strong>${fmt(t.amountUSD,'USD')}</strong><span class="muted">${String(t.date).slice(0,10)}${t.note?' · '+esc(t.note):''}</span></div><div class="row-actions"><button class="mini" data-utx-edit="${t.id}">Editar</button><button type="button" class="mini" data-utx-del="${t.id}" style="color:var(--danger)">Eliminar</button></div></div>`).join(''):'<div class="empty">Sin pagos todavía.</div>'}<div class="modal-actions"><button class="btn soft" data-close>Cerrar</button></div>`);document.querySelectorAll('[data-utx-del]').forEach(b=>b.onclick=async()=>{const t=u.paymentTransactions.find(x=>x.id===b.dataset.utxDel);if(!t||!confirm('¿Eliminar este pago del historial? El dinero volverá a Disponible USA.'))return;u.availableUSD+=Number(t.amountUSD)||0;usaReverseRef(t.id);u.paymentTransactions=u.paymentTransactions.filter(x=>x.id!==t.id);await save();usaPaymentHistory(p)});document.querySelectorAll('[data-utx-edit]').forEach(b=>b.onclick=()=>{const t=u.paymentTransactions.find(x=>x.id===b.dataset.utxEdit);if(!t)return;const v=prompt('Nuevo monto US$',String(t.amountUSD));if(v===null)return;const n=Number(v);if(!(n>0))return alert('Monto inválido.');u.availableUSD+=Number(t.amountUSD)-n;usaReverseRef(t.id);t.amountUSD=n;usaAllocateSource(n,'payment',t.id,p.name);save().then(()=>usaPaymentHistory(p))})}
function usaSendRD(){const u=usaState();showModal(`<h3>Enviar USA → RD</h3><form id="usaRemitForm" class="form-grid"><div class="field"><label>Monto a enviar US$</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Tasa de este envío</label><input name="rate" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Descripción (opcional)</label><input name="note" placeholder="Ej. Envío agosto"></div><p class="muted">La Entrada RD se creará con Diezmo y Ofrenda desactivados.</p><div class="modal-actions"><button class="btn soft" type="button" data-close>Cancelar</button><button class="btn gold">Enviar a RD</button></div></form>`);$('#usaRemitForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),amount=Number(fd.get('amount')),rate=Number(fd.get('rate'));if(!(amount>0&&rate>0))return;u.availableUSD-=amount;const id=uid(),date=String(fd.get('date'))+'T12:00:00.000Z',note=String(fd.get('note')||''),dop=amount*rate,rdIncomeId=uid(),links=usaAllocateSource(amount,'remittance',id,note);u.remittances.push({id,amountUSD:amount,rate,amountDOP:dop,date,note,rdIncomeId,sourceLinks:links});state.available.DOP+=dop;state.incomes.push({id:rdIncomeId,amount:dop,currency:'DOP',date,note:'Envío USA'+(note?' · '+note:''),applyTithe:false,applyOffering:false,source:'USA',usaRemittanceId:id});state.transactions.push({id:uid(),incomeId:rdIncomeId,accountType:'available',type:'add',amount:dop,currency:'DOP',note:'Entrada desde USA'+(note?' · '+note:''),date,receipts:[]});await save();$('#modal').close()}}
function usaRemoveLinkedRDIncome(r){const inc=state.incomes.find(i=>i.id===r.rdIncomeId);if(!inc)return true;const ds=incomeDistributions(inc.id);if(ds.length){if(!confirm(`La entrada RD de este envío ya fue distribuida en ${ds.length} distribución(es). Primero se revertirán. ¿Continuar?`))return false;for(const d of ds){try{reverseDistributionNoSave(d)}catch(e){alert(e.message||'No se pudo revertir la distribución.');return false}}}const dop=incomeDOP(inc);state.available.DOP-=dop;state.transactions=state.transactions.filter(t=>t.incomeId!==inc.id);state.incomes=state.incomes.filter(i=>i.id!==inc.id);return true}
function usaEditRemittance(r){showModal(`<h3>Editar envío USA → RD</h3><form id="usaRemitEdit" class="form-grid"><div class="field"><label>Monto US$</label><input name="amount" type="number" min="0.01" step="0.01" value="${r.amountUSD}" required></div><div class="field"><label>Tasa</label><input name="rate" type="number" min="0.01" step="0.01" value="${r.rate}" required></div><div class="field"><label>Descripción</label><input name="note" value="${esc(r.note||'')}"></div><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn">Guardar</button></div></form>`);$('#usaRemitEdit').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.currentTarget),amount=Number(fd.get('amount')),rate=Number(fd.get('rate'));if(!usaRemoveLinkedRDIncome(r))return;usaState().availableUSD+=Number(r.amountUSD)||0;usaReverseRef(r.id);usaState().remittances=usaState().remittances.filter(x=>x.id!==r.id);$('#modal').close();await save();setTimeout(()=>{usaSendRD();const f=$('#usaRemitForm');if(f){f.amount.value=amount;f.rate.value=rate;f.note.value=String(fd.get('note')||'')}},0)}}
async function usaDeleteRemittance(r){if(!confirm('¿Eliminar este envío USA → RD? También se eliminará o revertirá la Entrada RD asociada.'))return;if(!usaRemoveLinkedRDIncome(r))return;usaState().availableUSD+=Number(r.amountUSD)||0;usaReverseRef(r.id);usaState().remittances=usaState().remittances.filter(x=>x.id!==r.id);await save()}
function usaReverseChurchTransfer(c){const titheEnv=state.envelopes.find(e=>e.special==='tithe'),offEnv=state.envelopes.find(e=>e.special==='offering');withdrawEquivalent(titheEnv.balance,Number(c.titheDOP)||0,'DOP');withdrawEquivalent(offEnv.balance,Number(c.offeringDOP)||0,'DOP');usaState().availableUSD+=(Number(c.titheUSD)||0)+(Number(c.offeringUSD)||0);for(const l of c.sourceLinks||[]){const i=usaState().incomes.find(x=>x.id===l.incomeId);if(i){i.churchSent=false;delete i.churchTransferId}}state.transactions=state.transactions.filter(t=>t.usaChurchId!==c.id);usaReverseRef(c.id)}

function renderEnvelopes(){const specials=state.envelopes.filter(e=>e.special).sort((a,b)=>a.special==='tithe'?-1:b.special==='tithe'?1:0),normal=state.envelopes.filter(e=>!e.special).sort((a,b)=>a.name.localeCompare(b.name,'es'));const envCard=e=>`<article class="card envelope ${e.special?'special':''}" data-envelope-search="${esc(String(e.name).toLowerCase())}"><div><h3>${esc(e.name)} ${e.priority&&!e.special?'<span class="pill priority">Prioridad</span>':''}</h3><div class="money">${eqPair(e.balance)}</div><div class="submoney">${e.special?(e.special==='tithe'?'Diezmo · 10% cuando se active':'Ofrenda · % configurable cuando se active'):`Solicita ${fmt(e.request,e.currency)} por distribución · Principal: ${e.currency==='DOP'?'RD$':'US$'}`}</div><div class="row-actions"><button class="mini" data-act="add" data-id="${e.id}">+ Agregar</button><button class="mini" data-act="expense" data-id="${e.id}">− Gasto</button><button class="mini" data-act="history" data-id="${e.id}">Historial</button>${!e.special?`<button class="mini" data-act="edit" data-id="${e.id}">Editar</button>`:''}</div></div><span class="pill">${e.currency==='DOP'?'RD$':'US$'}</span></article>`;$('#view').innerHTML=`<div class="section-title"><h2>Sobres</h2><span class="muted">Orden alfabético</span></div><input id="envelopeSearch" class="searchbox" type="search" placeholder="Buscar sobre por nombre..." aria-label="Buscar sobre"><div class="grid">${specials.map(envCard).join('')}${normal.map(envCard).join('')}</div>`;$('#view').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>handleEnvelope(b.dataset.act,b.dataset.id));$('#envelopeSearch').oninput=e=>{const q=e.target.value.trim().toLowerCase();document.querySelectorAll('[data-envelope-search]').forEach(el=>el.style.display=!q||el.dataset.envelopeSearch.includes(q)?'':'none')}}
function monthlySourceOptions(selected='available'){return [`<option value="available" ${selected==='available'?'selected':''}>Disponible</option>`,...state.envelopes.map(e=>`<option value="env:${e.id}" ${selected===`env:${e.id}`?'selected':''}>${esc(e.name)}</option>`),`<option value="other" ${selected==='other'?'selected':''}>Otro origen</option>`].join('')}
function monthlySourceHolder(key){if(key==='available')return state.available;if(String(key).startsWith('env:'))return state.envelopes.find(e=>e.id===String(key).slice(4))?.balance||null;return null}
function monthlySourceName(key){if(key==='available')return 'Disponible';if(String(key).startsWith('env:'))return state.envelopes.find(e=>e.id===String(key).slice(4))?.name||'Sobre';return 'Otro origen'}
function chargeMonthlySource(key,amount,currency){if(key==='other')return {ok:true,debit:null};const holder=monthlySourceHolder(key);if(!holder)return {ok:false,message:'No se encontró el origen del pago.'};const dop=currency==='DOP'?amount:amount*state.rate;if(toDOP(holder)+1e-9<dop)return {ok:false,message:'Ese origen no tiene saldo suficiente para realizar el pago.'};withdrawEquivalent(holder,amount,currency);return {ok:true,debit:{amount,currency}}}
function restoreMonthlySource(t){if(t.sourceKey==='other'||t.sourceKey==='distribution')return;const holder=monthlySourceHolder(t.sourceKey);if(holder&&t.sourceDebit)applyAmount(holder,Number(t.sourceDebit.amount)||0,t.sourceDebit.currency||t.currency,1)}
function renderMonthlyPayments(){const ps=[...(state.monthlyPayments||[])].sort((a,b)=>String(a.dueDate||'9999').localeCompare(String(b.dueDate||'9999'))||a.name.localeCompare(b.name,'es'));$('#view').innerHTML=`<div class="section-title"><h2>Pagos</h2><button class="mini" id="newMonthlyInView">+ Nuevo pago</button></div><div class="toolbar" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center"><input id="monthlySearch" class="searchbox" style="margin:0" type="search" placeholder="Buscar pago por nombre..." aria-label="Buscar pago"><select id="paymentTypeFilter" aria-label="Filtrar pagos por tipo"><option value="all">Todos</option><option value="monthly">Mensuales</option><option value="annual">Anuales</option><option value="once">Una sola vez</option></select></div>${ps.length?`<div class="grid" style="margin-top:12px">${ps.map(p=>{const due=String(p.dueDate||''),active=p.active!==false,isDue=active&&due&&due<=monthEndISO();return `<article class="card monthly-card" data-month-search="${esc(String(p.name).toLowerCase())}" data-payment-type="${p.paymentType||'monthly'}"><div class="monthly-top"><div><h3>${esc(p.name)}</h3><div class="money">${fmt(p.amount,p.currency)}</div><div class="submoney">${active&&due?'Próximo pago: '+dateDO(parseLocalDate(due)):'Sin próximo pago'} · ${paymentTypeLabel(p)} · ${paymentScheduleLabel(p)} · ${p.currency==='DOP'?'RD$':'US$'}${p.note?' · '+esc(p.note):''}</div></div><span class="pill ${isDue?'status-pending':active?'':'status-paid'}">${!active?'Completado':isDue?'Pendiente':'Próximo'}</span></div><div class="row-actions">${active?`<button class="mini" data-month-act="pay" data-month-id="${p.id}">Pagar / transferir</button>`:''}<button class="mini" data-month-act="history" data-month-id="${p.id}">Historial</button><button class="mini" data-month-act="edit" data-month-id="${p.id}">Editar</button><button type="button" class="mini" style="color:var(--danger)" data-month-act="delete" data-month-id="${p.id}">Eliminar</button></div></article>`}).join('')}</div>`:'<div class="card empty" style="margin-top:12px">Todavía no tienes pagos.</div>'}`;$('#newMonthlyInView').onclick=newMonthlyPayment;document.querySelectorAll('[data-month-act]').forEach(b=>b.onclick=()=>handleMonthlyPayment(b.dataset.monthAct,b.dataset.monthId));const apply=()=>{const q=$('#monthlySearch').value.trim().toLowerCase(),f=$('#paymentTypeFilter').value;document.querySelectorAll('[data-month-search]').forEach(el=>el.style.display=(!q||el.dataset.monthSearch.includes(q))&&(f==='all'||el.dataset.paymentType===f)?'':'none')};$('#monthlySearch').oninput=apply;$('#paymentTypeFilter').onchange=apply}
function monthlyDayPicker(initialDays=[]){let days=normalizeDueDays(initialDays,1);const draw=()=>{const box=$('#monthlyDayChips');if(!box)return;box.innerHTML=days.map(d=>`<span class="day-chip">Día ${d}<button type="button" data-remove-day="${d}" aria-label="Eliminar día ${d}">×</button></span>`).join('');box.querySelectorAll('[data-remove-day]').forEach(b=>b.onclick=()=>{days=days.filter(x=>x!==Number(b.dataset.removeDay));draw()})};const add=()=>{const input=$('#monthlyDayInput'),d=Math.floor(Number(input.value));if(!(d>=1&&d<=31)){alert('Escribe un día entre 1 y 31.');return}if(!days.includes(d))days.push(d);days.sort((a,b)=>a-b);input.value='';draw();input.focus()};$('#addMonthlyDay').onclick=add;$('#monthlyDayInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};draw();return()=>[...days]}
function annualDatePicker(initialDates=[]){let dates=[...(initialDates||[])].filter(Boolean).sort();const draw=()=>{const box=$('#annualDateChips');if(!box)return;box.innerHTML=dates.map(d=>`<span class="day-chip">${dateDO(parseLocalDate(d))}<button type="button" data-remove-annual="${d}" aria-label="Eliminar fecha">×</button></span>`).join('');box.querySelectorAll('[data-remove-annual]').forEach(b=>b.onclick=()=>{dates=dates.filter(x=>x!==b.dataset.removeAnnual);draw()})};const add=()=>{const input=$('#annualDateInput'),d=input.value;if(!d){alert('Selecciona una fecha.');return}if(!dates.includes(d))dates.push(d);dates.sort();input.value='';draw()};$('#addAnnualDate').onclick=add;draw();return()=>[...dates]}
function paymentScheduleFields(type,p=null){if(type==='annual')return `<div class="field"><label>Fechas del año</label><div class="day-picker"><div class="field"><input id="annualDateInput" type="date"></div><button type="button" class="btn soft" id="addAnnualDate">Agregar fecha</button></div><div id="annualDateChips" class="day-chips"></div><small class="muted">Agrega todas las fechas del año que necesites. Se repetirán cada año.</small></div>`;if(type==='once')return `<div class="field"><label>Fecha del pago</label><input name="dueDate" type="date" value="${p?.dueDate||''}" required></div>`;return `<div class="field"><label>Primera fecha de pago</label><input name="dueDate" type="date" value="${p?.dueDate||''}" required></div><div class="field"><label>Días de pago de cada mes</label><div class="day-picker"><div class="field"><input id="monthlyDayInput" type="number" inputmode="numeric" min="1" max="31" placeholder="Ej. 5"></div><button type="button" class="btn soft" id="addMonthlyDay">Agregar día</button></div><div id="monthlyDayChips" class="day-chips"></div><small class="muted">Agrega cada día por separado.</small></div>`}
function newMonthlyPayment(){let type='monthly',getDays=null,getAnnual=null;const draw=()=>{showModal(`<h3>Nuevo pago</h3><form id="monthlyForm" class="form-grid"><div class="field"><label>Nombre</label><input name="name" placeholder="Ej. Electricidad" required></div><div class="field"><label>Monto</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Moneda</label><select name="currency"><option value="DOP">RD$</option><option value="USD">US$</option></select></div><div class="field"><label>Tipo de pago</label><select id="paymentType" name="paymentType"><option value="monthly" ${type==='monthly'?'selected':''}>Mensual</option><option value="annual" ${type==='annual'?'selected':''}>Anual</option><option value="once" ${type==='once'?'selected':''}>Una sola vez</option></select></div><div id="scheduleFields">${paymentScheduleFields(type)}</div><div class="field"><label>Nota o descripción (opcional)</label><input name="note"></div><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn green">Crear pago</button></div></form>`);if(type==='monthly')getDays=monthlyDayPicker([]);if(type==='annual')getAnnual=annualDatePicker([]);$('#paymentType').onchange=e=>{type=e.target.value;draw()};$('#monthlyForm').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),amount=Number(fd.get('amount'));if(!(amount>0))return;let dueDate='',dueDays=[],annualDates=[];if(type==='monthly'){dueDate=String(fd.get('dueDate'));if(!dueDate)return;const chosen=getDays(),fallback=Number(dueDate.slice(8,10));dueDays=chosen.length?normalizeDueDays(chosen,fallback):normalizeDueDays([],fallback)}else if(type==='annual'){const full=getAnnual();if(!full.length)return alert('Agrega por lo menos una fecha anual.');annualDates=normalizeAnnualDates(full);dueDate=firstAnnualDueFromDates(full)}else{dueDate=String(fd.get('dueDate'));if(!dueDate)return}state.monthlyPayments.push({id:uid(),name:String(fd.get('name')).trim(),amount,currency:fd.get('currency'),paymentType:type,dueDate,dueDays,billingDay:dueDays[0]||null,annualDates,note:String(fd.get('note')||''),active:true,createdAt:now()});await save();$('#modal').close()}};draw()}
function editMonthlyPayment(p){let type=p.paymentType||'monthly',getDays=null,getAnnual=null;const draw=()=>{showModal(`<h3>Editar pago</h3><form id="monthlyEditForm" class="form-grid"><div class="field"><label>Nombre</label><input name="name" value="${esc(p.name)}" required></div><div class="field"><label>Monto del próximo pago</label><input name="amount" type="number" min="0.01" step="0.01" value="${Number(p.amount)}" required></div><div class="field"><label>Moneda</label><select name="currency"><option value="DOP" ${p.currency==='DOP'?'selected':''}>RD$</option><option value="USD" ${p.currency==='USD'?'selected':''}>US$</option></select></div><div class="field"><label>Tipo de pago</label><select id="paymentType" name="paymentType"><option value="monthly" ${type==='monthly'?'selected':''}>Mensual</option><option value="annual" ${type==='annual'?'selected':''}>Anual</option><option value="once" ${type==='once'?'selected':''}>Una sola vez</option></select></div><div id="scheduleFields">${paymentScheduleFields(type,p)}</div><div class="field"><label>Nota o descripción (opcional)</label><input name="note" value="${esc(p.note||'')}"></div>${p.active===false?'<label class="form-check"><input id="reactivatePayment" type="checkbox"> <span>Reactivar este pago</span></label>':''}<div class="modal-actions"><button type="button" class="btn danger" id="deleteMonthly">Eliminar</button><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn">Guardar</button></div></form>`);if(type==='monthly')getDays=monthlyDayPicker(normalizeDueDays(p.dueDays,p.billingDay||String(p.dueDate||'').slice(8,10)));if(type==='annual'){const seed=(p.annualDates||[]).map(md=>annualDateISO(Number((p.dueDate||today()).slice(0,4)),md));getAnnual=annualDatePicker(seed)}$('#paymentType').onchange=e=>{type=e.target.value;draw()};$('#monthlyEditForm').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),a=Number(fd.get('amount'));if(!(a>0))return;let dueDate='',dueDays=[],annualDates=[];if(type==='monthly'){dueDate=String(fd.get('dueDate'));if(!dueDate)return;const chosen=getDays(),fallback=Number(dueDate.slice(8,10));dueDays=chosen.length?normalizeDueDays(chosen,fallback):normalizeDueDays([],fallback)}else if(type==='annual'){const full=getAnnual();if(!full.length)return alert('Agrega por lo menos una fecha anual.');annualDates=normalizeAnnualDates(full);dueDate=(p.paymentType==='annual'&&p.dueDate&&annualDates.includes(p.dueDate.slice(5)))?p.dueDate:firstAnnualDueFromDates(full)}else{dueDate=String(fd.get('dueDate'));if(!dueDate)return}p.name=String(fd.get('name')).trim();p.amount=a;p.currency=fd.get('currency');p.paymentType=type;p.dueDate=dueDate;p.dueDays=dueDays;p.billingDay=dueDays[0]||null;p.annualDates=annualDates;p.note=String(fd.get('note')||'');if(p.active===false&&$('#reactivatePayment')?.checked)p.active=true;if(type!=='once')p.active=true;await save();$('#modal').close()};$('#deleteMonthly').onclick=async()=>{await deleteMonthlyPaymentConfig(p);if(!(state.monthlyPayments||[]).some(x=>x.id===p.id))$('#modal').close()}};draw()}
function payMonthlyPayment(p){
  showModal(`<h3>Pagar / transferir · ${esc(p.name)}</h3><form id="monthlyPayForm" class="form-grid">
    <div class="field"><label>Monto a pagar</label><input name="amount" type="number" min="0.01" step="0.01" value="${Number(p.amount)}" required></div>
    <div class="field"><label>Moneda</label><select name="currency"><option value="DOP" ${p.currency==='DOP'?'selected':''}>RD$</option><option value="USD" ${p.currency==='USD'?'selected':''}>US$</option></select></div>
    <div class="field"><label>El dinero sale de</label><select name="source">${monthlySourceOptions('available')}</select></div>
    <div class="field"><label>Fecha del pago</label><input name="date" type="date" value="${today()}" required></div>
    <div class="field"><label>Nota o descripción (opcional)</label><input name="note" value="${esc(p.note||'')}"></div>
    <div class="card" style="padding:12px"><div class="muted">Este pago corresponde a</div><strong>${dateDO(parseLocalDate(p.dueDate))}</strong></div>
    <div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn green">Registrar pago</button></div>
  </form>`);
  $('#monthlyPayForm').onsubmit=async ev=>{
    ev.preventDefault();
    const fd=new FormData(ev.currentTarget),amount=Number(fd.get('amount')),currency=String(fd.get('currency')),sourceKey=String(fd.get('source')),date=String(fd.get('date'))+'T12:00:00.000Z';
    if(!(amount>0))return alert('Escribe un monto válido.');
    const ch=chargeMonthlySource(sourceKey,amount,currency);
    if(!ch.ok)return alert(ch.message);
    const paidDueDate=p.dueDate;
    state.monthlyPaymentTransactions.push({id:uid(),paymentId:p.id,type:'payment',amount,currency,dueDatePaid:paidDueDate,sourceKey,source:monthlySourceName(sourceKey),sourceDebit:ch.debit,date,note:String(fd.get('note')||''),distributionId:null});
    const next=nextPaymentDueDate(p,paidDueDate);if(next)p.dueDate=next;else{p.dueDate='';p.active=false;}
    await save();
    $('#modal').close();
  };
}
function monthlyHistory(p){
  const tx=(state.monthlyPaymentTransactions||[]).filter(t=>t.paymentId===p.id).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  showModal(`<h3>${esc(p.name)} · Historial</h3>${tx.length?`<div class="card">${tx.map(t=>`<div class="history-item"><div><strong class="positive">✓ Pagado ${fmt(t.amount,t.currency)}</strong><span class="muted">${t.date.slice(0,10)}${t.dueDatePaid?' · Correspondía a '+t.dueDatePaid:''}${t.source?' · Desde '+esc(t.source):''}${t.note?' · '+esc(t.note):''}</span>${t.distributionId?'<div class="submoney">Pago realizado dentro de una distribución</div>':`<div class="row-actions"><button class="mini" data-monthtx-edit="${t.id}">Editar</button><button type="button" class="mini" style="color:var(--danger)" data-monthtx-delete="${t.id}">Eliminar</button></div>`}</div></div>`).join('')}</div>`:'<div class="empty">Todavía no hay pagos registrados.</div>'}<div class="modal-actions"><button class="btn soft" data-close>Cerrar</button></div>`);
  document.querySelectorAll('[data-monthtx-edit]').forEach(b=>b.onclick=()=>editMonthlyTransaction(p,b.dataset.monthtxEdit));
  document.querySelectorAll('[data-monthtx-delete]').forEach(b=>b.onclick=()=>deleteMonthlyTransaction(p,b.dataset.monthtxDelete));
}
function editMonthlyTransaction(p,id){
  const t=(state.monthlyPaymentTransactions||[]).find(x=>x.id===id);if(!t)return;
  if(t.distributionId){alert('Este pago fue creado dentro de una distribución. Para mantener las cuentas cuadradas, no se puede editar por separado.');return}
  showModal(`<h3>Editar pago · ${esc(p.name)}</h3><form id="monthlyTxEditForm" class="form-grid">
    <div class="field"><label>Monto pagado</label><input name="amount" type="number" min="0.01" step="0.01" value="${Number(t.amount)}" required></div>
    <div class="field"><label>Moneda</label><select name="currency"><option value="DOP" ${t.currency==='DOP'?'selected':''}>RD$</option><option value="USD" ${t.currency==='USD'?'selected':''}>US$</option></select></div>
    <div class="field"><label>El dinero salió de</label><select name="source">${monthlySourceOptions(t.sourceKey||'other')}</select></div>
    <div class="field"><label>Fecha del pago</label><input name="date" type="date" value="${String(t.date).slice(0,10)}" required></div>
    <div class="field"><label>Nota o descripción (opcional)</label><input name="note" value="${esc(t.note||'')}"></div>
    <div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn">Guardar cambios</button></div>
  </form>`);
  $('#monthlyTxEditForm').onsubmit=async ev=>{
    ev.preventDefault();
    const fd=new FormData(ev.currentTarget),amount=Number(fd.get('amount')),currency=String(fd.get('currency')),sourceKey=String(fd.get('source')),date=String(fd.get('date'))+'T12:00:00.000Z';
    if(!(amount>0))return alert('Escribe un monto válido.');
    const old={amount:t.amount,currency:t.currency,sourceKey:t.sourceKey,source:t.source,sourceDebit:t.sourceDebit,date:t.date,note:t.note};
    restoreMonthlySource(t);
    const ch=chargeMonthlySource(sourceKey,amount,currency);
    if(!ch.ok){
      const rollback=chargeMonthlySource(old.sourceKey||'other',Number(old.amount)||0,old.currency||p.currency);
      if(rollback.ok){t.sourceDebit=rollback.debit;}
      return alert(ch.message);
    }
    t.amount=amount;t.currency=currency;t.sourceKey=sourceKey;t.source=monthlySourceName(sourceKey);t.sourceDebit=ch.debit;t.date=date;t.note=String(fd.get('note')||'');
    await save();$('#modal').close();
  };
}
async function deleteMonthlyTransaction(p,id){
  const t=(state.monthlyPaymentTransactions||[]).find(x=>x.id===id);if(!t)return;
  if(t.distributionId){alert('Este pago fue creado dentro de una distribución. Para mantener las cuentas cuadradas, no se puede eliminar por separado.');return}
  if(!confirm('¿Seguro que deseas eliminar este pago? El dinero volverá al lugar de donde salió.'))return;
  const others=(state.monthlyPaymentTransactions||[]).filter(x=>x.paymentId===p.id&&x.id!==id);
  const latest=[...others,t].sort((a,b)=>String(b.dueDatePaid||b.date).localeCompare(String(a.dueDatePaid||a.date)))[0];
  restoreMonthlySource(t);
  state.monthlyPaymentTransactions=state.monthlyPaymentTransactions.filter(x=>x.id!==id);
  if(latest&&latest.id===t.id&&t.dueDatePaid){const expected=nextPaymentDueDate(p,t.dueDatePaid);if((p.dueDate===expected)||(p.paymentType==='once'&&p.active===false)){p.dueDate=t.dueDatePaid;p.active=true;}}
  await save();$('#modal').close();monthlyHistory(p);
}

function handleMonthlyPayment(act,id){const p=(state.monthlyPayments||[]).find(x=>x.id===id);if(!p)return;if(act==='pay')return payMonthlyPayment(p);if(act==='history')return monthlyHistory(p);if(act==='edit')return editMonthlyPayment(p);if(act==='delete')return deleteMonthlyPaymentConfig(p)}
async function deleteMonthlyPaymentConfig(p){const hasHistory=(state.monthlyPaymentTransactions||[]).some(t=>t.paymentId===p.id);const msg=hasHistory?'Este pago tiene historial. Se eliminará el pago programado, pero se conservarán sus registros históricos. ¿Deseas continuar?':'¿Seguro que deseas eliminar este pago?';if(!confirm(msg))return;state.monthlyPayments=state.monthlyPayments.filter(x=>x.id!==p.id);await save()}
function renderAvailable(){const tx=state.transactions.filter(t=>t.accountType==='available').sort((a,b)=>b.date.localeCompare(a.date));$('#view').innerHTML=`<div class="section-title"><h2>Disponible</h2></div><div class="card"><div class="money">${eqPair(state.available)}</div><div class="row-actions"><button class="mini" id="availAdd">+ Agregar</button><button class="mini" id="availExpense">− Gasto</button></div></div>${historyHTML(tx)}`;$('#availAdd').onclick=()=>moneyModal('available',null,'add');$('#availExpense').onclick=()=>moneyModal('available',null,'expense');bindManualTransactionButtons()}
function renderIncome(){const xs=[...state.incomes].sort((a,b)=>b.date.localeCompare(a.date));$('#view').innerHTML=`<div class="section-title"><h2>Entradas generales</h2></div>${xs.length?`<div class="grid">${xs.map(x=>{const used=incomeUsedDOP(x.id),total=incomeDOP(x),status=used<=0.005?'🟡 Pendiente de distribuir':'🟢 Distribuida';return `<article class="card"><div class="history-item"><div><strong>${fmt(x.amount,x.currency)}</strong><span class="muted">${x.date.slice(0,10)}${x.note?' · '+esc(x.note):''}</span><div class="submoney">${status}</div></div></div><div class="row-actions"><button class="mini" data-income-edit="${x.id}">Editar</button><button type="button" class="mini" style="color:var(--danger)" data-income-delete="${x.id}">Eliminar</button></div></article>`}).join('')}</div>`:'<div class="empty">Todavía no hay entradas.</div>'}`;document.querySelectorAll('[data-income-edit]').forEach(b=>b.onclick=()=>editIncome(b.dataset.incomeEdit));document.querySelectorAll('[data-income-delete]').forEach(b=>b.onclick=()=>deleteIncome(b.dataset.incomeDelete))}
function renderDistributions(){const xs=[...state.distributions].sort((a,b)=>b.date.localeCompare(a.date));$('#view').innerHTML=`<div class="section-title"><h2>Distribuciones</h2></div>${xs.length?`<div class="grid">${xs.map(d=>`<article class="card"><strong>${esc(d.name)}</strong><div class="muted">${d.date.slice(0,10)}</div><div class="submoney">Base: ${fmt(d.baseDOP,'DOP')} · Diezmo: ${fmt(d.titheDOP,'DOP')} · Ofrenda: ${fmt(d.offeringDOP,'DOP')}</div><div class="row-actions"><button class="mini" data-dist="${d.id}">Ver detalle</button></div></article>`).join('')}</div>`:'<div class="empty">Todavía no hay distribuciones.</div>'}`;document.querySelectorAll('[data-dist]').forEach(b=>b.onclick=()=>showDistribution(b.dataset.dist))}
function renderSettings(){$('#view').innerHTML=`<div class="section-title"><h2>Configuración</h2></div><div class="grid"><div class="card"><div class="settings-row"><div class="field"><label>Valor manual del dólar en pesos dominicanos</label><input type="number" id="rate" min="0.01" step="0.01" value="${state.rate}"></div><button class="btn" id="saveRate">Guardar</button></div><p class="muted">Ejemplo: si colocas 56, US$1 = RD$56.</p></div><div class="card"><div class="settings-row"><div class="field"><label>Porcentaje de Ofrenda RD</label><input type="number" id="offeringRateRD" min="0" step="0.01" value="${Number(state.offeringRateRD||0)}"></div><button class="btn" id="saveOfferingRD">Guardar</button></div><p class="muted">El Diezmo permanece en 10% cuando se active. La Ofrenda puede cambiarse.</p></div><div class="card"><strong>Respaldo</strong><p class="muted">Incluye saldos, historiales, distribuciones y fotos de recibos.</p><div class="row-actions"><button class="btn soft" id="backup">Crear respaldo</button><label class="btn outline" style="display:inline-flex;align-items:center;justify-content:center">Restaurar<input type="file" id="restore" accept="application/json" hidden></label></div></div></div>`;$('#saveRate').onclick=async()=>{const v=Number($('#rate').value);if(v>0){state.rate=v;await save()}};$('#saveOfferingRD').onclick=async()=>{const v=Math.max(0,Number($('#offeringRateRD').value)||0);state.offeringRateRD=v;await save()};$('#backup').onclick=backup;$('#restore').onchange=restore}
function historyHTML(tx){tx=(tx||[]).filter(t=>Math.abs(Number(t.amount)||0)>=0.005);return tx.length?`<div class="card" style="margin-top:12px">${tx.map(t=>{const manual=!t.distributionId&&!t.incomeId&&(t.type==='add'||t.type==='expense');return `<div class="history-item"><div><strong class="${t.type==='expense'?'negative':'positive'}">${t.type==='expense'?'-':'+'}${fmt(t.amount,t.currency)}</strong><span class="muted">${t.date.slice(0,10)}${t.note?' · '+esc(t.note):''}</span>${manual?`<div class="row-actions"><button class="mini" data-tx-edit="${t.id}">Editar</button><button type="button" class="mini" style="color:var(--danger)" data-tx-delete="${t.id}">Eliminar</button>${t.type==='expense'?`<button class="mini" data-tx-photos="${t.id}">${t.receipts?.length?'🧾 Recibos ('+t.receipts.length+')':'🧾 Agregar recibo'}</button>`:''}</div>`:''}</div>${t.receipts?.length?`<button class="receipt" data-receipts="${t.id}" title="Ver recibos">🧾 ${t.receipts.length}</button>`:''}</div>`}).join('')}</div>`:'<div class="empty">No hay movimientos todavía.</div>'}
function transactionHolder(t){if(t.accountType==='available')return state.available;if(t.accountType==='envelope'){const e=state.envelopes.find(x=>x.id===t.accountId);return e?e.balance:null}return null}
function reverseManualTransaction(t,holder){if(t.type==='add'){const dop=t.currency==='DOP'?Number(t.amount):Number(t.amount)*state.rate;if(toDOP(holder)+0.005<dop)return false;withdrawEquivalent(holder,Number(t.amount),t.currency)}else if(t.type==='expense'){applyAmount(holder,Number(t.amount),t.currency,1)}return true}
function manualHistoryContext(t){if(t.accountType==='envelope')return state.envelopes.find(x=>x.id===t.accountId);return null}
function reopenManualHistory(t){if(t.accountType==='envelope'){const e=manualHistoryContext(t);if(e)handleEnvelope('history',e.id);else $('#modal').close()}else if(t.accountType==='available')renderAvailable()}
function bindManualTransactionButtons(){bindReceiptButtons();document.querySelectorAll('[data-tx-edit]').forEach(b=>b.onclick=()=>editManualTransaction(b.dataset.txEdit));document.querySelectorAll('[data-tx-delete]').forEach(b=>b.onclick=()=>deleteManualTransaction(b.dataset.txDelete));document.querySelectorAll('[data-tx-photos]').forEach(b=>b.onclick=()=>showReceipts(b.dataset.txPhotos))}
function editManualTransaction(id){const t=state.transactions.find(x=>x.id===id);if(!t||t.distributionId||t.incomeId)return;const holder=transactionHolder(t);if(!holder)return;showModal(`<h3>Editar ${t.type==='expense'?'gasto':'entrada manual'}</h3><form id="editManualTx" class="form-grid"><div class="field"><label>Monto</label><input name="amount" type="number" min="0.01" step="0.01" value="${Number(t.amount)}" required></div><div class="field"><label>Moneda</label><select name="currency"><option value="DOP" ${t.currency==='DOP'?'selected':''}>RD$</option><option value="USD" ${t.currency==='USD'?'selected':''}>US$</option></select></div><div class="field"><label>Descripción (opcional)</label><input name="note" value="${esc(t.note||'')}"></div>${t.type==='expense'?`<div class="field"><label>Agregar más fotos (opcional)</label><input name="receipts" type="file" accept="image/*" capture="environment" multiple></div>`:''}<div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn">Guardar cambios</button></div></form>`);$('#editManualTx').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),amount=Number(fd.get('amount')),currency=String(fd.get('currency'));if(!(amount>0))return;const backup={DOP:Number(holder.DOP)||0,USD:Number(holder.USD)||0};if(!reverseManualTransaction(t,holder)){holder.DOP=backup.DOP;holder.USD=backup.USD;alert('No se puede editar esta entrada porque parte de ese dinero ya fue gastado. Primero devuelve el dinero al sobre.');return}const dop=currency==='DOP'?amount:amount*state.rate;if(t.type==='expense'&&toDOP(holder)+0.005<dop){holder.DOP=backup.DOP;holder.USD=backup.USD;alert('El saldo no alcanza para guardar ese gasto con el nuevo monto.');return}if(t.type==='expense')withdrawEquivalent(holder,amount,currency);else applyAmount(holder,amount,currency,1);t.amount=amount;t.currency=currency;t.note=String(fd.get('note')||'');if(t.type==='expense'){for(const f of ev.currentTarget.receipts.files)t.receipts.push(await fileToDataURL(f))}await save();$('#modal').close();reopenManualHistory(t)}}
async function deleteManualTransaction(id){const t=state.transactions.find(x=>x.id===id);if(!t||t.distributionId||t.incomeId)return;const holder=transactionHolder(t);if(!holder)return;const msg=t.type==='expense'?'¿Seguro que deseas eliminar este gasto? El dinero gastado volverá al saldo del sobre.':'¿Seguro que deseas eliminar esta entrada manual? Ese dinero se retirará del saldo del sobre.';if(!confirm(msg))return;if(!reverseManualTransaction(t,holder)){alert('No se puede eliminar esta entrada porque parte de ese dinero ya fue gastado. Primero devuelve el dinero al sobre.');return}state.transactions=state.transactions.filter(x=>x.id!==id);await save();$('#modal').close();reopenManualHistory(t)}

function applyAmount(holder,amount,currency,sign){holder[currency]=(holder[currency]||0)+amount*sign; if(Math.abs(holder[currency])<1e-9)holder[currency]=0}
function withdrawEquivalent(holder,amount,currency){let dop=currency==='DOP'?amount:amount*state.rate;if(currency==='DOP'){const useD=Math.min(holder.DOP||0,dop);holder.DOP-=useD;dop-=useD;if(dop>1e-9){holder.USD-=dop/state.rate}}else{let usd=amount;const useU=Math.min(holder.USD||0,usd);holder.USD-=useU;usd-=useU;if(usd>1e-9){holder.DOP-=usd*state.rate}}if(Math.abs(holder.DOP)<1e-9)holder.DOP=0;if(Math.abs(holder.USD)<1e-9)holder.USD=0}

function canReverseDistributions(ds,incomeAmountDOP=0){const needs=new Map();let returned=0;for(const d of ds){returned+=Number(d.actualUsedDOP)||0;const t=state.envelopes.find(e=>e.special==='tithe'),o=state.envelopes.find(e=>e.special==='offering');needs.set(t.id,(needs.get(t.id)||0)+(Number(d.titheDOP)||0));needs.set(o.id,(needs.get(o.id)||0)+(Number(d.offeringDOP)||0));for(const a of d.allocations||[])needs.set(a.id,(needs.get(a.id)||0)+(Number(a.amountDOP)||0))}for(const [id,need] of needs){const e=state.envelopes.find(x=>x.id===id);if(!e||toDOP(e.balance)+0.005<need)return {ok:false,message:`No se puede revertir porque el sobre “${e?e.name:'eliminado'}” ya no tiene suficiente saldo. Primero devuelve el dinero usado a ese sobre.`}}if(toDOP(state.available)+returned+0.005<incomeAmountDOP)return {ok:false,message:'No se puede eliminar o editar esta entrada porque parte del dinero disponible ya fue gastado. Primero devuelve ese dinero a Disponible.'};return {ok:true}}
function removeDistributionTransactions(d){state.transactions=state.transactions.filter(t=>{if(t.distributionId===d.id)return false;if(t.date!==d.date)return true;const n=String(t.note||'');return !(n===`Diezmo · ${d.name}`||n===`Ofrenda · ${d.name}`||n.startsWith(`Distribución · ${d.name}`))})}
function reverseDistributionNoSave(d){const tithe=state.envelopes.find(e=>e.special==='tithe'),offering=state.envelopes.find(e=>e.special==='offering');withdrawEquivalent(tithe.balance,Number(d.titheDOP)||0,'DOP');withdrawEquivalent(offering.balance,Number(d.offeringDOP)||0,'DOP');for(const a of d.allocations||[]){if((Number(a.amountDOP)||0)<=0)continue;const e=state.envelopes.find(x=>x.id===a.id);if(e){const rate=Number(d.rateAtDistribution)||state.rate;withdrawEquivalent(e.balance,a.currency==='USD'?(Number(a.amountDOP)||0)/rate:(Number(a.amountDOP)||0),a.currency||'DOP')}}state.cardTransactions=(state.cardTransactions||[]).filter(t=>t.distributionId!==d.id);const monthlyTx=(state.monthlyPaymentTransactions||[]).filter(t=>t.distributionId===d.id);for(const mt of monthlyTx){const p=(state.monthlyPayments||[]).find(x=>x.id===mt.paymentId);if(p&&mt.dueDatePaid){const expectedNext=nextMonthlyDueDate(mt.dueDatePaid,p.dueDays);if(p.dueDate===expectedNext)p.dueDate=mt.dueDatePaid}}state.monthlyPaymentTransactions=(state.monthlyPaymentTransactions||[]).filter(t=>t.distributionId!==d.id);state.available.DOP=(state.available.DOP||0)+(Number(d.actualUsedDOP)||0);removeDistributionTransactions(d);state.distributions=state.distributions.filter(x=>x.id!==d.id)}
function findIncomeTransaction(i){return state.transactions.find(t=>t.incomeId===i.id)||state.transactions.find(t=>t.accountType==='available'&&t.type==='add'&&t.date===i.date&&Number(t.amount)===Number(i.amount)&&t.currency===i.currency&&String(t.note||'').startsWith('Entrada'))}
async function deleteIncome(id){const i=state.incomes.find(x=>x.id===id);if(!i)return;const ds=incomeDistributions(id),msg=ds.length?'Esta acción eliminará la entrada y revertirá toda la distribución asociada, incluyendo Diezmo, Ofrenda, sobres y Disponible. ¿Deseas continuar?':'¿Seguro que deseas eliminar esta entrada?';if(!confirm(msg))return;const check=canReverseDistributions(ds,incomeDOP(i));if(!check.ok){alert(check.message);return}for(const d of [...ds].sort((a,b)=>String(b.date).localeCompare(String(a.date))))reverseDistributionNoSave(d);withdrawEquivalent(state.available,i.amount,i.currency);const tx=findIncomeTransaction(i);if(tx)state.transactions=state.transactions.filter(t=>t.id!==tx.id);state.incomes=state.incomes.filter(x=>x.id!==id);await save()}
function editIncome(id){const i=state.incomes.find(x=>x.id===id);if(!i)return;showModal(`<h3>Editar entrada</h3><form id="editIncomeForm" class="form-grid"><div class="field"><label>Monto</label><input name="amount" type="number" min="0.01" step="0.01" value="${Number(i.amount)}" required></div><div class="field"><label>Moneda</label><select name="currency"><option value="DOP" ${i.currency==='DOP'?'selected':''}>RD$</option><option value="USD" ${i.currency==='USD'?'selected':''}>US$</option></select></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${i.date.slice(0,10)}" required></div><div class="field"><label>Descripción (opcional)</label><input name="note" value="${esc(i.note||'')}"></div><p class="muted">Si esta entrada ya fue distribuida, al guardar se revertirá esa distribución y la entrada quedará 🟡 Pendiente de distribuir.</p><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn green">Guardar cambios</button></div></form>`);$('#editIncomeForm').onsubmit=async ev=>{ev.preventDefault();const ds=incomeDistributions(id);if(ds.length&&!confirm('Esta entrada ya fue distribuida. Al editarla se revertirá la distribución anterior y quedará pendiente de distribuir. ¿Deseas continuar?'))return;const check=canReverseDistributions(ds,incomeDOP(i));if(!check.ok){alert(check.message);return}for(const d of [...ds].sort((a,b)=>String(b.date).localeCompare(String(a.date))))reverseDistributionNoSave(d);withdrawEquivalent(state.available,i.amount,i.currency);const fd=new FormData(ev.currentTarget),newAmount=Number(fd.get('amount')),newCurrency=fd.get('currency'),newDate=String(fd.get('date'))+'T12:00:00.000Z',newNote=String(fd.get('note')||'');applyAmount(state.available,newAmount,newCurrency,1);const tx=findIncomeTransaction(i);i.amount=newAmount;i.currency=newCurrency;i.date=newDate;i.note=newNote;if(tx){tx.incomeId=i.id;tx.amount=newAmount;tx.currency=newCurrency;tx.date=newDate;tx.note='Entrada'+(newNote?' · '+newNote:'')}else state.transactions.push({id:uid(),incomeId:i.id,accountType:'available',accountId:null,type:'add',amount:newAmount,currency:newCurrency,note:'Entrada'+(newNote?' · '+newNote:''),date:newDate,receipts:[]});await save();$('#modal').close()}}

function cardRateAmount(amount,currency,target,rate=state.rate){rate=Number(rate)||state.rate;const dop=currency==='DOP'?Number(amount):Number(amount)*rate;return target==='DOP'?dop:dop/rate}
function paymentCardAmount(card,t){if(card.currency==='USD'){if(t.currency==='USD')return Number(t.amount)||0;const r=Number(t.paymentRate)||state.rate;return (Number(t.amount)||0)/r}return cardRateAmount(t.amount,t.currency,'DOP')}
function withdrawEquivalentAtRate(holder,amount,currency,rate){rate=Number(rate)||state.rate;const debit={DOP:0,USD:0};if(currency==='DOP'){let dop=Number(amount)||0;const useD=Math.min(holder.DOP||0,dop);holder.DOP-=useD;debit.DOP+=useD;dop-=useD;if(dop>1e-9){const usd=dop/rate;if((holder.USD||0)+1e-9<usd)throw new Error('Saldo insuficiente.');holder.USD-=usd;debit.USD+=usd}}else{let usd=Number(amount)||0;const useU=Math.min(holder.USD||0,usd);holder.USD-=useU;debit.USD+=useU;usd-=useU;if(usd>1e-9){const dop=usd*rate;if((holder.DOP||0)+1e-9<dop)throw new Error('Saldo insuficiente.');holder.DOP-=dop;debit.DOP+=dop}}if(Math.abs(holder.DOP)<1e-9)holder.DOP=0;if(Math.abs(holder.USD)<1e-9)holder.USD=0;return debit}
function parseLocalDate(value,end=false){if(!value)return null;const m=String(value).slice(0,10).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return null;return new Date(Number(m[1]),Number(m[2])-1,Number(m[3]),end?23:0,end?59:0,end?59:0,end?999:0)}
function legacyCardDate(card,kind,ref=new Date()){const raw=kind==='cutoff'?card.cutoffDay:card.dueDay,day=Math.max(1,Math.min(28,Number(raw)||1)),y=ref.getFullYear(),m=ref.getMonth();if(kind==='cutoff'){const d=ref.getDate()>=day?new Date(y,m,day,23,59,59,999):new Date(y,m-1,day,23,59,59,999);return d}const cut=legacyCardDate(card,'cutoff',ref),cutDay=cut.getDate();return day>cutDay?new Date(cut.getFullYear(),cut.getMonth(),day,23,59,59,999):new Date(cut.getFullYear(),cut.getMonth()+1,day,23,59,59,999)}
function lastCutoffDate(card,ref=new Date()){return parseLocalDate(card.cutoffDate,true)||legacyCardDate(card,'cutoff',ref)}
function nextDueDate(card,cut=lastCutoffDate(card)){return parseLocalDate(card.dueDate,true)||legacyCardDate(card,'due',cut)}
function cardBalances(card){const tx=(state.cardTransactions||[]).filter(t=>t.cardId===card.id).sort((a,b)=>String(a.date).localeCompare(String(b.date)));const expenses=[];let payments=0;for(const t of tx){const a=t.type==='payment'?paymentCardAmount(card,t):cardRateAmount(t.amount,t.currency,card.currency);if(t.type==='expense')expenses.push({date:t.date,left:a});else if(t.type==='payment')payments+=a}for(const e of expenses){if(payments<=0)break;const use=Math.min(e.left,payments);e.left-=use;payments-=use}const cut=lastCutoffDate(card),cutMs=cut.getTime();let statement=0,newSpend=0;for(const e of expenses){if(e.left<=.0001)continue;}statement=expenses.filter(e=>new Date(e.date).getTime()<=cutMs).reduce((s,e)=>s+e.left,0);newSpend=expenses.filter(e=>new Date(e.date).getTime()>cutMs).reduce((s,e)=>s+e.left,0);const debt=statement+newSpend,available=Number(card.limit||0)-debt;return {statement,newSpend,debt,available,cut,due:nextDueDate(card,cut)}}
function dateDO(d){return new Intl.DateTimeFormat('es-DO',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)}
function creditCardsHTML(query=''){const q=String(query||'').trim().toLowerCase();const cards=[...(state.creditCards||[])].sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0)).filter(c=>!q||String(c.name).toLowerCase().includes(q)||String(c.last4||'').includes(q));return `<section class="credit-section"><div class="credit-heading"><h2>Tarjetas de crédito</h2><button class="mini" id="newCardBtn">+ Tarjeta</button></div>${cards.length?`<div class="credit-grid">${cards.map((c,i)=>{const b=cardBalances(c),limit=Math.max(0,Number(c.limit)||0),pct=limit>0?Math.min(100,(b.debt/limit)*100):0,cls=b.debt>limit?'over100':pct>=80?'over80':'';return `<article class="credit-card ${cls}" style="background:linear-gradient(135deg,${c.color||'#0d3b66'},#102a43)"><div class="cc-top"><div><h3>${esc(c.name)}</h3><div class="cc-digits">•••• ${esc(c.last4||'0000')}</div></div><span class="pill">${c.currency==='DOP'?'RD$':'US$'}</span></div><div class="cc-total">${fmt(b.debt,c.currency)}</div><div class="cc-sub">Deuda total · Disponible ${fmt(b.available,c.currency)}</div><div class="cc-bar"><span style="width:${pct}%"></span></div><div class="cc-metrics"><div class="cc-metric"><small>Cortado pendiente</small><strong>${fmt(b.statement,c.currency)}</strong></div><div class="cc-metric"><small>Después del corte</small><strong>${fmt(b.newSpend,c.currency)}</strong></div><div class="cc-metric"><small>Límite</small><strong>${fmt(limit,c.currency)}</strong></div><div class="cc-metric"><small>Uso</small><strong>${limit?((b.debt/limit)*100).toFixed(1):'0.0'}%</strong></div></div><div class="cc-dates"><span>Corte: ${dateDO(b.cut)}</span><span>Límite de pago: ${dateDO(b.due)}</span></div><div class="row-actions"><button class="mini" data-card-act="expense" data-card-id="${c.id}">+ Gasto</button><button class="mini" data-card-act="pay" data-card-id="${c.id}">Pagar</button><button class="mini" data-card-act="history" data-card-id="${c.id}">Historial</button><button class="mini" data-card-act="edit" data-card-id="${c.id}">Editar</button>${i>0?`<button class="mini" data-card-act="up" data-card-id="${c.id}">↑</button>`:''}${i<cards.length-1?`<button class="mini" data-card-act="down" data-card-id="${c.id}">↓</button>`:''}</div></article>`}).join('')}</div>`:'<div class="card empty">Todavía no tienes tarjetas de crédito.</div>'}</section>`}

function newCreditCard(){showModal(`<h3>Nueva tarjeta de crédito</h3><form id="cardForm" class="form-grid"><div class="field"><label>Nombre</label><input name="name" placeholder="Ej. Visa Popular" required></div><div class="field"><label>Últimos 4 dígitos</label><input name="last4" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="4582" required></div><div class="field"><label>Moneda</label><select name="currency"><option value="DOP">RD$</option><option value="USD">US$</option></select></div><div class="field"><label>Límite de crédito</label><input name="limit" type="number" min="0" step="0.01" required></div><div class="field"><label>Pendiente del último corte</label><input name="statementDebt" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Consumo después del corte</label><input name="newDebt" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Fecha de corte</label><input name="cutoffDate" type="date" required></div><div class="field"><label>Fecha límite de pago</label><input name="dueDate" type="date" required></div><div class="field"><label>Color de la tarjeta</label><input name="color" type="color" value="#0d3b66"></div><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn">Crear tarjeta</button></div></form>`);$('#cardForm').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),last4=String(fd.get('last4')).replace(/\D/g,'').slice(-4);if(last4.length!==4){alert('Escribe exactamente los últimos 4 dígitos.');return}const card={id:uid(),name:String(fd.get('name')).trim(),last4,currency:fd.get('currency'),limit:Math.max(0,Number(fd.get('limit'))||0),cutoffDate:String(fd.get('cutoffDate')||''),dueDate:String(fd.get('dueDate')||''),color:String(fd.get('color')||'#0d3b66'),order:(state.creditCards||[]).length};state.creditCards.push(card);const statementDebt=Math.max(0,Number(fd.get('statementDebt'))||0),newDebt=Math.max(0,Number(fd.get('newDebt'))||0),cut=lastCutoffDate(card);if(statementDebt>0)state.cardTransactions.push({id:uid(),cardId:card.id,type:'expense',amount:statementDebt,currency:card.currency,note:'Pendiente del último corte',date:(card.cutoffDate?card.cutoffDate+'T12:00:00':cut.toISOString()),receipts:[]});if(newDebt>0)state.cardTransactions.push({id:uid(),cardId:card.id,type:'expense',amount:newDebt,currency:card.currency,note:'Consumo inicial después del corte',date:now(),receipts:[]});await save();$('#modal').close()}}
function editCreditCard(card){showModal(`<h3>Editar tarjeta</h3><form id="editCardForm" class="form-grid"><div class="field"><label>Nombre</label><input name="name" value="${esc(card.name)}" required></div><div class="field"><label>Últimos 4 dígitos</label><input name="last4" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" value="${esc(card.last4)}" required></div><div class="field"><label>Moneda</label><select name="currency"><option value="DOP" ${card.currency==='DOP'?'selected':''}>RD$</option><option value="USD" ${card.currency==='USD'?'selected':''}>US$</option></select></div><div class="field"><label>Límite de crédito</label><input name="limit" type="number" min="0" step="0.01" value="${Number(card.limit)||0}" required></div><div class="field"><label>Fecha de corte</label><input name="cutoffDate" type="date" value="${card.cutoffDate||lastCutoffDate(card).toISOString().slice(0,10)}" required></div><div class="field"><label>Fecha límite de pago</label><input name="dueDate" type="date" value="${card.dueDate||nextDueDate(card).toISOString().slice(0,10)}" required></div><div class="field"><label>Color</label><input name="color" type="color" value="${card.color||'#0d3b66'}"></div><div class="modal-actions"><button type="button" class="btn danger" id="deleteCard">Eliminar</button><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn">Guardar</button></div></form>`);$('#editCardForm').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),last4=String(fd.get('last4')).replace(/\D/g,'').slice(-4);if(last4.length!==4)return alert('Escribe exactamente los últimos 4 dígitos.');card.name=String(fd.get('name')).trim();card.last4=last4;card.currency=fd.get('currency');card.limit=Math.max(0,Number(fd.get('limit'))||0);card.cutoffDate=String(fd.get('cutoffDate')||'');card.dueDate=String(fd.get('dueDate')||'');delete card.cutoffDay;delete card.dueDay;card.color=String(fd.get('color')||'#0d3b66');await save();$('#moda
