<style>
:root{--blue:#0d3b66;--blue2:#146da0;--green:#268a3a;--green2:#49a942;--gold:#f2b827;--bg:#f5f7fa;--card:#fff;--text:#142033;--muted:#667085;--border:#d9e1ea;--danger:#b42318;--soft:#eef4f9}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0002} .brand{display:flex;gap:12px;align-items:center;max-width:980px;margin:auto}.brand img{width:52px;height:52px;border-radius:13px}.brand h1{font-size:22px;margin:0}.brand p{margin:2px 0 0;font-size:13px;opacity:.88}
main{max-width:980px;margin:auto;padding:14px 12px 88px}.grid{display:grid;gap:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 2px 8px #0d3b6610}.stat small,.muted{color:var(--muted)}.stat strong{display:block;font-size:19px;margin-top:4px}.gold{color:#9b6a00}.green{color:var(--green)}.red{color:var(--danger)}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}.btn{border:0;border-radius:12px;padding:12px 13px;font-weight:700;cursor:pointer;min-height:46px;background:var(--blue);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.gold{background:var(--gold);color:#3d2a00}.btn.soft{background:var(--soft);color:var(--blue)}.btn.danger{background:#fee4e2;color:var(--danger)}.btn.outline{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0 14px;padding-bottom:2px}.tab{white-space:nowrap;border:1px solid var(--border);background:#fff;color:var(--blue);border-radius:999px;padding:9px 13px;font-weight:700}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0}.section-title h2{font-size:18px;margin:0}.envelope{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.envelope h3{margin:0 0 4px;font-size:16px}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:12px;background:var(--soft);color:var(--blue);font-weight:700}.pill.priority{background:#fff4cc;color:#795600}.money{font-weight:800}.submoney{font-size:13px;color:var(--muted);margin-top:2px}.row-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.mini{border:1px solid var(--border);background:#fff;border-radius:9px;padding:7px 9px;color:var(--blue);font-weight:650}
.empty{text-align:center;color:var(--muted);padding:24px 8px}.history-item{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--border)}.history-item:last-child{border-bottom:0}.history-item strong{display:block}.receipt{border:0;background:#fff3cd;border-radius:9px;padding:6px 9px;cursor:pointer}.positive{color:var(--green)}.negative{color:var(--danger)}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:center;padding:8px;z-index:5}.bottom .btn{width:min(520px,96%);font-size:16px}
dialog{border:0;border-radius:18px;padding:0;max-width:620px;width:calc(100% - 24px);box-shadow:0 20px 70px #0005}dialog::backdrop{background:#001d3d99}.modal{padding:18px}.modal h3{margin:0 0 13px}.form-grid{display:grid;gap:10px}.field label{display:block;font-size:13px;font-weight:750;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;font-size:16px;background:#fff}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px;flex-wrap:wrap}.preview{max-height:55vh;overflow:auto;border:1px solid var(--border);border-radius:12px;padding:10px}.preview-line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border)}.preview-line:last-child{border-bottom:0}.photo-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo-card img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px}.photo-view img{max-width:100%;max-height:70vh;display:block;margin:auto;border-radius:12px}.settings-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.special{border-left:5px solid var(--gold)}.dist-choice{border:1px solid var(--border);border-radius:12px;padding:10px;margin:8px 0}.dist-choice-head{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}.dist-choice-main{display:flex;align-items:center;gap:8px;min-width:0}.dist-choice-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.dist-choice-controls .field{min-width:0}.dist-order{display:flex;gap:4px}.dist-order button{min-width:40px}.dist-section-title{font-weight:850;margin:14px 0 6px}.dist-choice.off{opacity:.55}.dist-note{font-size:12px;color:var(--muted);margin-top:5px}
.credit-section{margin:14px 0 18px}.credit-grid{display:grid;gap:12px}.credit-card{position:relative;overflow:hidden;border:0;border-radius:18px;padding:16px;color:#fff;box-shadow:0 8px 22px #0d3b6625}.credit-card::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-65px;top:-70px;background:#ffffff18}.credit-card .cc-top,.credit-card .cc-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;position:relative;z-index:1}.credit-card h3{margin:0;font-size:17px}.credit-card .cc-digits{font-size:13px;opacity:.9}.credit-card .cc-total{font-size:24px;font-weight:850;margin:13px 0 3px;position:relative;z-index:1}.credit-card .cc-sub{font-size:12px;opacity:.9;position:relative;z-index:1}.credit-card .cc-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;position:relative;z-index:1}.credit-card .cc-metric{background:#ffffff18;border:1px solid #ffffff25;border-radius:11px;padding:8px}.credit-card .cc-metric small{display:block;opacity:.85}.credit-card .cc-metric strong{display:block;margin-top:2px}.credit-card .cc-bar{height:8px;background:#ffffff30;border-radius:999px;overflow:hidden;margin-top:12px;position:relative;z-index:1}.credit-card .cc-bar span{display:block;height:100%;background:#fff;border-radius:999px}.credit-card.over80 .cc-bar span{background:#ffd166}.credit-card.over100 .cc-bar span{background:#ff8a80}.credit-card .row-actions{position:relative;z-index:1}.credit-card .mini{background:#ffffffee;color:#17324a;border-color:#ffffff88}.credit-heading{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:12px 0 8px}.credit-heading h2{font-size:18px;margin:0}.credit-card .cc-dates{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;margin-top:10px;opacity:.95;position:relative;z-index:1}
.searchbox{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:12px;font-size:16px;background:#fff;margin:0 0 12px}.day-picker{display:flex;gap:8px;align-items:end;flex-wrap:wrap}.day-picker .field{flex:1;min-width:130px}.day-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.day-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:#eef5ff;border:1px solid var(--border);font-weight:700}.day-chip button{border:0;background:transparent;font-size:18px;line-height:1;cursor:pointer}.monthly-card{border-left:5px solid var(--green)}.monthly-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.monthly-card h3{margin:0 0 4px}.status-pending{background:#fff4cc;color:#795600}.status-paid{background:#dcfae6;color:#176b33}
@media(min-width:720px){.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.actions{grid-template-columns:repeat(5,minmax(0,1fr))}.photo-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

<body>
<header><div class="brand"><img src="icon-192.png" alt="Ícono Mis Sobres"><div><h1>Mis Sobres</h1><p>Administra con propósito lo que Dios pone en tus manos.</p></div></div></header>
<main>
<section class="grid stats" id="stats"></section>
<section class="actions">
<button class="btn green" id="addIncomeBtn">+ Agregar entrada</button>
<button class="btn gold" id="distributeBtn">Distribuir</button>
<button class="btn soft" id="transferBtn">Transferir</button>
<button class="btn soft" id="addEnvelopeBtn">+ Nuevo sobre</button>
<button class="btn soft" id="addMonthlyBtn">+ Nuevo pago</button>
</section>
<nav class="tabs" id="tabs">
<button class="tab active" data-view="envelopes">Sobres</button><button class="tab" data-view="usa">Estados Unidos</button><button class="tab" data-view="cards">Tarjetas</button><button class="tab" data-view="monthly">Pagos</button><button class="tab" data-view="available">Disponible</button><button class="tab" data-view="income">Entradas</button><button class="tab" data-view="distributions">Distribuciones</button><button class="tab" data-view="settings">Configuración</button>
</nav>
<section id="view"></section>
</main>
<div class="bottom"><button class="btn" id="quickExpenseBtn">− Registrar gasto</button></div>
<dialog id="modal"><div class="modal" id="modalBody"></div></dialog>
<script>
const DB='mis-sobres-db', STORE='state';
const defaultState={schemaVersion:8,rate:56,offeringRateRD:5,available:{DOP:0,USD:0},envelopes:[],transactions:[],incomes:[],distributions:[],creditCards:[],cardTransactions:[],monthlyPayments:[],monthlyPaymentTransactions:[],usa:{availableUSD:0,offeringRate:5,incomes:[],payments:[],paymentTransactions:[],transactions:[],remittances:[],churchTransfers:[]},createdAt:new Date().toISOString()};
let state=structuredClone(defaultState), currentView='envelopes';
const $=s=>document.querySelector(s), fmt=(n,c)=>new Intl.NumberFormat('es-DO',{style:'currency',currency:c==='DOP'?'DOP':'USD',maximumFractionDigits:2}).format(Number(n)||0);
const uid=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const today=()=>new Date().toISOString().slice(0,10); const now=()=>new Date().toISOString();
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){const db=await openDB();state=await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readonly'),r=tx.objectStore(STORE).get('app');r.onsuccess=()=>res(r.result||structuredClone(defaultState));r.onerror=()=>rej(r.error)});ensureSpecial();let changed=false;if(migrateV2())changed=true;if(migrateV3())changed=true;if(migrateV4())changed=true;if(migrateV5())changed=true;if(migrateV6())changed=true;if(migrateV7())changed=true;if(migrateV8())changed=true;if(cleanupZeroEffectDistributions())changed=true;if(changed){await save();return}render()}
async function save(){const db=await openDB();await new Promise((res,rej)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,'app');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});render()}
function ensureSpecial(){if(!state.envelopes.some(e=>e.special==='tithe'))state.envelopes.unshift({id:uid(),name:'Diezmo',currency:'DOP',request:0,priority:true,balance:{DOP:0,USD:0},special:'tithe'});if(!state.envelopes.some(e=>e.special==='offering'))state.envelopes.splice(1,0,{id:uid(),name:'Ofrenda',currency:'DOP',request:0,priority:true,balance:{DOP:0,USD:0},special:'offering'})}
function migrateV2(){if((state.schemaVersion||1)>=2)return false;let restored=0;for(const d of state.distributions||[]){const allocated=(d.allocations||[]).reduce((sum,a)=>sum+(Number(a.amountDOP)||0),0),base=Number(d.baseDOP)||0,tithe=Number(d.titheDOP)||0,offering=Number(d.offeringDOP)||0,leftover=Math.max(0,base-tithe-offering-allocated);d.leftoverDOP=leftover;d.actualUsedDOP=Math.max(0,base-leftover);d.fixedV2=true;if(leftover>0.005){state.available.DOP=(state.available.DOP||0)+leftover;restored+=leftover}}state.schemaVersion=2;if(restored>0.005)state.transactions.push({id:uid(),accountType:'available',accountId:null,type:'add',amount:restored,currency:'DOP',note:'Corrección automática: sobrante de distribuciones anteriores',date:now(),receipts:[]});return true}
function migrateV3(){if((state.schemaVersion||1)>=3)return false;state.incomes=state.incomes||[];state.distributions=state.distributions||[];state.transactions=state.transactions||[];for(const i of state.incomes){const tx=state.transactions.find(t=>t.accountType==='available'&&t.type==='add'&&!t.incomeId&&t.date===i.date&&Number(t.amount)===Number(i.amount)&&t.currency===i.currency&&String(t.note||'').startsWith('Entrada'));if(tx)tx.incomeId=i.id}
const remaining=new Map(state.incomes.map(i=>[i.id,(i.currency==='DOP'?Number(i.amount):Number(i.amount)*state.rate)]));for(const d of [...state.distributions].sort((a,b)=>String(a.date).localeCompare(String(b.date)))){if(!Array.isArray(d.sourceUses)){let need=Number(d.actualUsedDOP)||0;d.sourceUses=[];for(const i of [...state.incomes].sort((a,b)=>String(a.date).localeCompare(String(b.date)))){if(String(i.date)>String(d.date)||need<=0.005)continue;const left=Math.max(0,remaining.get(i.id)||0),use=Math.min(left,need);if(use>0.005){d.sourceUses.push({incomeId:i.id,amountDOP:use});remaining.set(i.id,left-use);need-=use}}}for(const t of state.transactions){if(t.distributionId)continue;if(t.date!==d.date)continue;const n=String(t.note||'');if(n===`Diezmo · ${d.name}`||n===`Ofrenda · ${d.name}`||n.startsWith(`Distribución · ${d.name}`))t.distributionId=d.id}}
state.schemaVersion=3;return true}
function migrateV4(){if((state.schemaVersion||1)>=4)return false;state.creditCards=Array.isArray(state.creditCards)?state.creditCards:[];state.cardTransactions=Array.isArray(state.cardTransactions)?state.cardTransactions:[];for(const c of state.creditCards){if(c.order==null)c.order=state.creditCards.indexOf(c);if(!c.color)c.color='#0d3b66'}state.schemaVersion=4;return true}
function migrateV5(){if((state.schemaVersion||1)>=5)return false;state.monthlyPayments=Array.isArray(state.monthlyPayments)?state.monthlyPayments:[];state.monthlyPaymentTransactions=Array.isArray(state.monthlyPaymentTransactions)?state.monthlyPaymentTransactions:[];for(const p of state.monthlyPayments){if(!p.dueDate)p.dueDate=today();if(!p.billingDay)p.billingDay=Number(String(p.dueDate).slice(8,10))||1;if(p.note==null)p.note=''}state.schemaVersion=5;return true}
function normalizeDueDays(value,fallback){const raw=Array.isArray(value)?value:String(value||'').split(',');const days=[...new Set(raw.map(x=>Math.floor(Number(x))).filter(x=>x>=1&&x<=31))].sort((a,b)=>a-b);return days.length?days:[Math.max(1,Math.min(31,Number(fallback)||1))]}
function migrateV6(){if((state.schemaVersion||1)>=6)return false;for(const p of state.monthlyPayments||[]){p.dueDays=normalizeDueDays(p.dueDays,p.billingDay||String(p.dueDate||'').slice(8,10));p.billingDay=p.dueDays[0]}state.schemaVersion=6;return true}
function migrateV7(){if((state.schemaVersion||1)>=7)return false;for(const p of state.monthlyPayments||[]){if(!p.paymentType)p.paymentType='monthly';if(p.active==null)p.active=true;if(p.paymentType==='monthly'){p.dueDays=normalizeDueDays(p.dueDays,p.billingDay||String(p.dueDate||'').slice(8,10));p.billingDay=p.dueDays[0]}if(p.paymentType==='annual')p.annualDates=normalizeAnnualDates(p.annualDates||[p.dueDate]);}state.schemaVersion=7;return true}
function migrateV8(){if((state.schemaVersion||1)>=8)return false;state.offeringRateRD=Number.isFinite(Number(state.offeringRateRD))?Number(state.offeringRateRD):5;state.usa=state.usa||{};state.usa.availableUSD=Number(state.usa.availableUSD)||0;state.usa.offeringRate=Number.isFinite(Number(state.usa.offeringRate))?Number(state.usa.offeringRate):5;state.usa.incomes=Array.isArray(state.usa.incomes)?state.usa.incomes:[];state.usa.payments=Array.isArray(state.usa.payments)?state.usa.payments:[];state.usa.paymentTransactions=Array.isArray(state.usa.paymentTransactions)?state.usa.paymentTransactions:[];state.usa.transactions=Array.isArray(state.usa.transactions)?state.usa.transactions:[];state.usa.remittances=Array.isArray(state.usa.remittances)?state.usa.remittances:[];state.usa.churchTransfers=Array.isArray(state.usa.churchTransfers)?state.usa.churchTransfers:[];for(const i of state.incomes||[]){if(i.applyTithe==null)i.applyTithe=true;if(i.applyOffering==null)i.applyOffering=true}state.schemaVersion=8;return true}

function incomeDOP(i){return i.currency==='DOP'?Number(i.amount)||0:(Number(i.amount)||0)*state.rate}
function incomeUsedDOP(id){return state.distributions.reduce((s,d)=>s+(d.sourceUses||[]).filter(u=>u.incomeId===id).reduce((a,u)=>a+(Number(u.amountDOP)||0),0),0)}
function incomeDistributions(id){return state.distributions.filter(d=>(d.sourceUses||[]).some(u=>u.incomeId===id))}
function cleanupZeroEffectDistributions(){let changed=false;const zeroIds=[];for(const d of state.distributions||[]){const tithe=Number(d.titheDOP)||0,off=Number(d.offeringDOP)||0,alloc=(d.allocations||[]).reduce((s,a)=>s+(Number(a.amountDOP)||0),0),cards=(d.cardPayments||[]).reduce((s,a)=>s+(Number(a.costDOP)||0),0),monthly=(d.monthlyPayments||[]).reduce((s,a)=>s+(Number(a.costDOP)||0),0),used=Number(d.actualUsedDOP)||0;if(Math.abs(tithe)+Math.abs(off)+Math.abs(alloc)+Math.abs(cards)+Math.abs(monthly)+Math.abs(used)<0.005)zeroIds.push(d.id)}if(zeroIds.length){const set=new Set(zeroIds);state.distributions=(state.distributions||[]).filter(d=>!set.has(d.id));state.transactions=(state.transactions||[]).filter(t=>!set.has(t.distributionId)&&!(t.accountType==='available'&&t.type==='expense'&&Math.abs(Number(t.amount)||0)<0.005&&String(t.note||'').startsWith('Distribución · ')));state.cardTransactions=(state.cardTransactions||[]).filter(t=>!set.has(t.distributionId));state.monthlyPaymentTransactions=(state.monthlyPaymentTransactions||[]).filter(t=>!set.has(t.distributionId));changed=true}return changed}

function sourceUsesForDistribution(amountDOP){let need=amountDOP,uses=[];for(const i of [...state.incomes].sort((a,b)=>String(a.date).localeCompare(String(b.date)))){const left=Math.max(0,incomeDOP(i)-incomeUsedDOP(i.id)),use=Math.min(left,need);if(use>0.005){uses.push({incomeId:i.id,amountDOP:use});need-=use}if(need<=0.005)break}return uses}

function toDOP(obj){return (obj.DOP||0)+(obj.USD||0)*state.rate} function fromDOP(v,c){return c==='DOP'?v:v/state.rate} function eqPair(obj){let d=toDOP(obj);return `${fmt(d,'DOP')} · ${fmt(d/state.rate,'USD')}`}
function totalEnvelopeDOP(){return state.envelopes.reduce((s,e)=>s+toDOP(e.balance),0)}
function totalDOP(){return totalEnvelopeDOP()+toDOP(state.available)}
function nextNeedDOP(){return state.envelopes.filter(e=>!e.special).reduce((s,e)=>s+(e.currency==='DOP'?e.request:e.request*state.rate),0)}
function addMonthClamped(dateStr,billingDay){const [y,m]=String(dateStr).split('-').map(Number),base=new Date(y,m-1,1),next=new Date(base.getFullYear(),base.getMonth()+1,1),last=new Date(next.getFullYear(),next.getMonth()+1,0).getDate(),day=Math.min(Math.max(1,Number(billingDay)||1),last);return `${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
function dateForMonthDay(y,m0,day){const last=new Date(y,m0+1,0).getDate(),d=Math.min(Math.max(1,Number(day)||1),last);return `${y}-${String(m0+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
function nextMonthlyDueDate(currentDate,dueDays){const cur=String(currentDate||today()).slice(0,10),d=parseLocalDate(cur)||new Date(),days=normalizeDueDays(dueDays,d.getDate());for(let add=0;add<18;add++){const base=new Date(d.getFullYear(),d.getMonth()+add,1),candidates=[...new Set(days.map(day=>dateForMonthDay(base.getFullYear(),base.getMonth(),day)))].sort();for(const c of candidates)if(c>cur)return c}return addMonthClamped(cur,days[0])}
function dueDaysLabel(p){return normalizeDueDays(p.dueDays,p.billingDay||String(p.dueDate||'').slice(8,10)).join(', ')}
function normalizeAnnualDates(value){const raw=Array.isArray(value)?value:String(value||'').split(',');return [...new Set(raw.map(x=>String(x||'').trim()).filter(Boolean).map(x=>{const m=x.match(/^(?:\d{4}-)?(\d{2})-(\d{2})$/);return m?`${m[1]}-${m[2]}`:null}).filter(Boolean))].sort()}
function annualDateISO(year,md){const [m,d]=String(md).split('-').map(Number),last=new Date(year,m,0).getDate(),day=Math.min(d,last);return `${year}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`}
function firstAnnualDueFromDates(fullDates){const vals=(fullDates||[]).filter(Boolean).sort();if(!vals.length)return today();const now=today(),future=vals.find(x=>x>=now);if(future)return future;const md=String(vals[0]).slice(5);return annualDateISO(Number(now.slice(0,4))+1,md)}
function nextAnnualDueDate(currentDate,annualDates){const cur=String(currentDate||today()).slice(0,10),year=Number(cur.slice(0,4)),mds=normalizeAnnualDates(annualDates);for(let y=year;y<=year+3;y++){for(const md of mds){const c=annualDateISO(y,md);if(c>cur)return c}}return annualDateISO(year+1,mds[0]||'01-01')}
function nextPaymentDueDate(p,currentDate){if((p.paymentType||'monthly')==='annual')return nextAnnualDueDate(currentDate,p.annualDates);if(p.paymentType==='once')return '';return nextMonthlyDueDate(currentDate,p.dueDays)}
function paymentTypeLabel(p){return p.paymentType==='annual'?'Anual':p.paymentType==='once'?'Una sola vez':'Mensual'}
function paymentScheduleLabel(p){if(p.paymentType==='annual')return normalizeAnnualDates(p.annualDates).map(md=>{const [m,d]=md.split('-');return `${d}/${m}`}).join(', ');if(p.paymentType==='once')return p.dueDate?dateDO(parseLocalDate(p.dueDate)):'Completado';return 'Días '+dueDaysLabel(p)}
function monthEndISO(){const d=new Date(),x=new Date(d.getFullYear(),d.getMonth()+1,0);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function monthlyDueNow(){const end=monthEndISO();return (state.monthlyPayments||[]).filter(p=>p.active!==false&&p.dueDate&&String(p.dueDate)<=end)}
function monthlyPendingDOP(){return monthlyDueNow().reduce((s,p)=>s+(p.currency==='DOP'?Number(p.amount)||0:(Number(p.amount)||0)*state.rate),0)}
function renderStats(){const avail=toDOP(state.available),need=nextNeedDOP(),mp=monthlyDueNow(),mpDOP=monthlyPendingDOP(),u=usaState(),up=usaDuePayments(),lastRate=Number(u.remittances?.at(-1)?.rate)||state.rate;$('#stats').innerHTML=`<div class="card stat"><small>Patrimonio total RD</small><strong>${fmt(totalDOP(),'DOP')}</strong><span class="submoney">${fmt(totalDOP()/state.rate,'USD')}</span></div><div class="card stat"><small>Disponible RD</small><strong>${fmt(avail,'DOP')}</strong><span class="submoney">${fmt(avail/state.rate,'USD')}</span></div><div class="card stat"><small>Pagos RD pendientes</small><strong>${mp.length} · ${fmt(mpDOP,'DOP')}</strong></div><div class="card stat"><small>Disponible USA</small><strong>${fmt(u.availableUSD,'USD')}</strong><span class="submoney">${fmt(u.availableUSD*lastRate,'DOP')}</span></div><div class="card stat"><small>Pagos USA pendientes</small><strong>${up.length} · ${fmt(up.reduce((a,p)=>a+Number(p.amount||0),0),'USD')}</strong></div>`}
