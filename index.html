function cardExpense(card){showModal(`<h3>Gasto · ${esc(card.name)}</h3><form id="cardExpenseForm" class="form-grid"><div class="field"><label>Monto</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Moneda</label><select name="currency"><option value="${card.currency}">${card.currency==='DOP'?'RD$':'US$'}</option><option value="${card.currency==='DOP'?'USD':'DOP'}">${card.currency==='DOP'?'US$':'RD$'}</option></select></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Descripción (opcional)</label><input name="note"></div><div class="field"><label>Fotos de recibos (opcional, varias)</label><input name="receipts" type="file" accept="image/*" capture="environment" multiple></div><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn danger">Registrar gasto</button></div></form>`);$('#cardExpenseForm').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),amount=Number(fd.get('amount')),currency=fd.get('currency');if(!(amount>0))return;let receipts=[];for(const f of ev.currentTarget.receipts.files)receipts.push(await fileToDataURL(f));state.cardTransactions.push({id:uid(),cardId:card.id,type:'expense',amount,currency,note:String(fd.get('note')||''),date:String(fd.get('date'))+'T12:00:00.000Z',receipts});await save();$('#modal').close()}}
function cardSourceOptions(selected='other'){return [`<option value="available" ${selected==='available'?'selected':''}>Disponible</option>`,...state.envelopes.map(e=>`<option value="env:${e.id}" ${selected===`env:${e.id}`?'selected':''}>${esc(e.name)}</option>`),`<option value="other" ${selected==='other'?'selected':''}>Otro origen</option>`].join('')}
function findCardSourceTx(t){if(t.sourceTransactionId)return state.transactions.find(x=>x.id===t.sourceTransactionId)||null;const date=t.date,amount=Number(t.amount),currency=t.currency,notePrefix=`Pago tarjeta `;return state.transactions.find(x=>x.type==='expense'&&x.date===date&&Number(x.amount)===amount&&x.currency===currency&&String(x.note||'').startsWith(notePrefix))||null}
function restorePaymentSource(t){if(t.sourceKey==='other'||t.source==='Otro origen')return;let holder=null;if(t.sourceKey==='available'||t.source==='Disponible')holder=state.available;else if((t.sourceKey||'').startsWith('env:')){const env=state.envelopes.find(e=>e.id===t.sourceKey.slice(4));holder=env?.balance}else{const env=state.envelopes.find(e=>e.name===t.source);holder=env?.balance}if(holder){if(t.sourceDebit){holder.DOP=(holder.DOP||0)+(Number(t.sourceDebit.DOP)||0);holder.USD=(holder.USD||0)+(Number(t.sourceDebit.USD)||0)}else applyAmount(holder,t.amount,t.currency,1)}if(t.sourceTransactionId)state.transactions=state.transactions.filter(x=>x.id!==t.sourceTransactionId)}
function chargePaymentSource(card,amount,currency,source,date,paymentRate){let sourceName='Otro origen',sourceTransactionId=null,sourceDebit=null;if(source==='other')return {sourceName,sourceTransactionId,sourceDebit};let holder,accountType,accountId=null;if(source==='available'){holder=state.available;accountType='available';sourceName='Disponible'}else if(source.startsWith('env:')){const id=source.slice(4),env=state.envelopes.find(e=>e.id===id);if(!env)throw new Error('No se encontró el sobre seleccionado.');holder=env.balance;accountType='envelope';accountId=env.id;sourceName=env.name}else return {sourceName,sourceTransactionId,sourceDebit};const rate=card.currency==='USD'?(Number(paymentRate)||0):state.rate;if(card.currency==='USD'&&!(rate>0))throw new Error('Escribe la tasa USD para este pago.');const needDOP=currency==='DOP'?Number(amount):(Number(amount)*rate);const holderDOP=(holder.DOP||0)+(holder.USD||0)*rate;if(holderDOP+1e-9<needDOP)throw new Error(source==='available'?'Disponible no tiene saldo suficiente.':`El sobre “${sourceName}” no tiene saldo suficiente.`);sourceDebit=withdrawEquivalentAtRate(holder,amount,currency,rate);const txAmountDOP=(sourceDebit.DOP||0)+(sourceDebit.USD||0)*rate;const tx={id:uid(),accountType,accountId,type:'expense',amount:txAmountDOP,currency:'DOP',note:`Pago tarjeta ${card.name}`,date,receipts:[],paymentRate:card.currency==='USD'?rate:null};state.transactions.push(tx);sourceTransactionId=tx.id;return {sourceName,sourceTransactionId,sourceDebit}}
function cardPayment(card){const usd=card.currency==='USD';showModal(`<h3>Pagar · ${esc(card.name)}</h3><form id="cardPayForm" class="form-grid"><div class="field"><label>Monto</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Moneda del pago</label><select name="currency"><option value="${card.currency}">${card.currency==='DOP'?'RD$':'US$'}</option><option value="${card.currency==='DOP'?'USD':'DOP'}">${card.currency==='DOP'?'US$':'RD$'}</option></select></div>${usd?`<div class="field"><label>Tasa USD para este pago</label><input name="paymentRate" type="number" min="0.01" step="0.01" placeholder="Ej. 60.25" required><small class="muted">US$1 = RD$ <span id="payRatePreview">—</span>. Esta tasa se usa solo en este pago.</small></div>`:''}<div class="field"><label>Sale de</label><select name="source">${cardSourceOptions()}</select></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${today()}" required></div><div class="field"><label>Descripción (opcional)</label><input name="note"></div>${usd?`<div class="card"><small>Equivalencia de este pago</small><strong id="paymentEquivalent">Escribe el monto y la tasa</strong></div>`:''}<div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn green">Registrar pago</button></div></form>`);const form=$('#cardPayForm');if(usd){const upd=()=>{const a=Number(form.amount.value)||0,r=Number(form.paymentRate.value)||0,c=form.currency.value;$('#payRatePreview').textContent=r>0?r.toFixed(2):'—';if(a>0&&r>0)$('#paymentEquivalent').textContent=c==='USD'?`${fmt(a,'USD')} = ${fmt(a*r,'DOP')}`:`${fmt(a,'DOP')} = ${fmt(a/r,'USD')}`;else $('#paymentEquivalent').textContent='Escribe el monto y la tasa'};form.amount.addEventListener('input',upd);form.paymentRate.addEventListener('input',upd);form.currency.addEventListener('change',upd)}form.onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(form),amount=Number(fd.get('amount')),currency=fd.get('currency'),source=String(fd.get('source')),paymentRate=usd?Number(fd.get('paymentRate')):state.rate,debt=cardBalances(card).debt,payInCard=usd?(currency==='USD'?amount:amount/paymentRate):cardRateAmount(amount,currency,card.currency);if(!(amount>0))return;if(usd&&!(paymentRate>0))return alert('Escribe la tasa USD para este pago.');if(payInCard>debt+0.005)return alert('El pago no puede ser mayor que la deuda actual de la tarjeta.');const date=String(fd.get('date'))+'T12:00:00.000Z';try{const ch=chargePaymentSource(card,amount,currency,source,date,paymentRate);state.cardTransactions.push({id:uid(),cardId:card.id,type:'payment',amount,currency,paymentRate:usd?paymentRate:null,note:(String(fd.get('note')||'')||`Pago desde ${ch.sourceName}`),source:ch.sourceName,sourceKey:source,sourceTransactionId:ch.sourceTransactionId,sourceDebit:ch.sourceDebit,date,receipts:[]});await save();$('#modal').close()}catch(err){alert(err.message)}}}

function editCardTransaction(card,id){const t=state.cardTransactions.find(x=>x.id===id);if(!t)return;if(t.distributionId){alert('Este pago fue creado dentro de una distribución. Para mantener las cuentas cuadradas, no se puede editar por separado de esa distribución.');return}if(t.type==='expense'){showModal(`<h3>Editar gasto · ${esc(card.name)}</h3><form id="editCardExpense" class="form-grid"><div class="field"><label>Monto</label><input name="amount" type="number" min="0.01" step="0.01" value="${Number(t.amount)}" required></div><div class="field"><label>Moneda</label><select name="currency"><option value="DOP" ${t.currency==='DOP'?'selected':''}>RD$</option><option value="USD" ${t.currency==='USD'?'selected':''}>US$</option></select></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${t.date.slice(0,10)}" required></div><div class="field"><label>Descripción (opcional)</label><input name="note" value="${esc(t.note||'')}"></div><div class="field"><label>Agregar más recibos</label><input name="receipts" type="file" accept="image/*" capture="environment" multiple></div><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn">Guardar cambios</button></div></form>`);$('#editCardExpense').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),amount=Number(fd.get('amount'));if(!(amount>0))return;for(const f of ev.currentTarget.receipts.files)t.receipts.push(await fileToDataURL(f));t.amount=amount;t.currency=fd.get('currency');t.date=String(fd.get('date'))+'T12:00:00.000Z';t.note=String(fd.get('note')||'');await save();$('#modal').close()}}else{const currentKey=t.sourceKey||((t.source==='Disponible')?'available':(state.envelopes.find(e=>e.name===t.source)?`env:${state.envelopes.find(e=>e.name===t.source).id}`:'other')),usd=card.currency==='USD';showModal(`<h3>Editar pago · ${esc(card.name)}</h3><form id="editCardPayment" class="form-grid"><div class="field"><label>Monto</label><input name="amount" type="number" min="0.01" step="0.01" value="${Number(t.amount)}" required></div><div class="field"><label>Moneda del pago</label><select name="currency"><option value="DOP" ${t.currency==='DOP'?'selected':''}>RD$</option><option value="USD" ${t.currency==='USD'?'selected':''}>US$</option></select></div>${usd?`<div class="field"><label>Tasa USD para este pago</label><input name="paymentRate" type="number" min="0.01" step="0.01" value="${Number(t.paymentRate)||''}" placeholder="Ej. 60.25" required><small class="muted">Esta tasa pertenece únicamente a esta transacción.</small></div>`:''}<div class="field"><label>Sale de</label><select name="source">${cardSourceOptions(currentKey)}</select></div><div class="field"><label>Fecha</label><input name="date" type="date" value="${t.date.slice(0,10)}" required></div><div class="field"><label>Descripción (opcional)</label><input name="note" value="${esc(t.note||'')}"></div><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn">Guardar cambios</button></div></form>`);$('#editCardPayment').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),amount=Number(fd.get('amount')),currency=fd.get('currency'),source=String(fd.get('source')),paymentRate=usd?Number(fd.get('paymentRate')):state.rate;if(!(amount>0))return;if(usd&&!(paymentRate>0))return alert('Escribe la tasa USD para este pago.');const debtWithoutThis=cardBalances(card).debt+paymentCardAmount(card,t),newPay=usd?(currency==='USD'?amount:amount/paymentRate):cardRateAmount(amount,currency,card.currency);if(newPay>debtWithoutThis+0.005)return alert('El pago no puede ser mayor que la deuda de la tarjeta.');const old={amount:t.amount,currency:t.currency,paymentRate:t.paymentRate,source:t.source,sourceKey:t.sourceKey,sourceTransactionId:t.sourceTransactionId,sourceDebit:t.sourceDebit,date:t.date,note:t.note};restorePaymentSource(t);const date=String(fd.get('date'))+'T12:00:00.000Z';try{const ch=chargePaymentSource(card,amount,currency,source,date,paymentRate);t.amount=amount;t.currency=currency;t.paymentRate=usd?paymentRate:null;t.source=ch.sourceName;t.sourceKey=source;t.sourceTransactionId=ch.sourceTransactionId;t.sourceDebit=ch.sourceDebit;t.date=date;t.note=String(fd.get('note')||'')||`Pago desde ${ch.sourceName}`;await save();$('#modal').close()}catch(err){try{const oldKey=old.sourceKey||((old.source==='Disponible')?'available':(state.envelopes.find(e=>e.name===old.source)?`env:${state.envelopes.find(e=>e.name===old.source).id}`:'other'));const ch=chargePaymentSource(card,old.amount,old.currency,oldKey,old.date,old.paymentRate||state.rate);t.amount=old.amount;t.currency=old.currency;t.paymentRate=old.paymentRate;t.source=ch.sourceName;t.sourceKey=oldKey;t.sourceTransactionId=ch.sourceTransactionId;t.sourceDebit=ch.sourceDebit;t.date=old.date;t.note=old.note}catch{}alert(err.message)}}}}
async function deleteCardTransaction(card,id){const t=state.cardTransactions.find(x=>x.id===id);if(!t)return;if(t.distributionId){alert('Este pago fue creado dentro de una distribución. Para mantener las cuentas cuadradas, no se puede eliminar por separado de esa distribución.');return}const msg=t.type==='payment'?'¿Seguro que deseas eliminar este pago? El dinero volverá al origen del pago y la deuda de la tarjeta aumentará.':'¿Seguro que deseas eliminar este gasto? La deuda de la tarjeta se reducirá y el crédito disponible aumentará.';if(!confirm(msg))return;if(t.type==='payment')restorePaymentSource(t);state.cardTransactions=state.cardTransactions.filter(x=>x.id!==id);await save();$('#modal').close();cardHistory(card)}
async function moveCard(card,dir){const cards=[...(state.creditCards||[])].sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0)),i=cards.findIndex(c=>c.id===card.id),j=i+(dir==='up'?-1:1);if(i<0||j<0||j>=cards.length)return;const tmp=cards[i].order;cards[i].order=cards[j].order;cards[j].order=tmp;await save()}
function handleCreditCard(act,id){const card=(state.creditCards||[]).find(c=>c.id===id);if(!card)return;if(act==='expense')cardExpense(card);if(act==='pay')cardPayment(card);if(act==='history')cardHistory(card);if(act==='edit')editCreditCard(card);if(act==='up'||act==='down')moveCard(card,act)}

function distribute(){const availDOP=toDOP(state.available);if(availDOP<=0){alert('No hay dinero disponible para distribuir.');return}showModal(`<h3>Nueva distribución</h3><form id="distStart" class="form-grid"><div class="field"><label>Nombre de la distribución</label><input name="name" placeholder="Ej. Pago del 25" required></div><div class="field"><label>Monto a distribuir</label><input name="amount" type="number" min="0.01" step="0.01" value="${availDOP.toFixed(2)}" required></div><div class="field"><label>Moneda del monto</label><select name="currency"><option value="DOP">RD$</option><option value="USD">US$</option></select></div><div class="field"><label><input type="checkbox" name="applyTithe" checked> Aplicar Diezmo 10%</label></div><div class="field"><label><input type="checkbox" name="applyOffering" checked> Aplicar Ofrenda ${Number(state.offeringRateRD||0).toFixed(2)}%</label></div><p class="muted">Disponible total equivalente: ${eqPair(state.available)}</p><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn gold">Elegir pagos y sobres</button></div></form>`);$('#distStart').onsubmit=ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),amount=Number(fd.get('amount')),currency=fd.get('currency'),baseDOP=currency==='DOP'?amount:amount*state.rate;if(baseDOP>availDOP+1e-9){alert('El monto supera el dinero disponible.');return}{const form=ev.currentTarget;configureDistribution(String(fd.get('name')).trim(),baseDOP,{applyTithe:form.applyTithe.checked,applyOffering:form.applyOffering.checked})}}}
function configureDistribution(name,baseDOP,churchOpts={applyTithe:true,applyOffering:true}){const cards=[...(state.creditCards||[])].sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0));const monthly=[...(state.monthlyPayments||[])].filter(p=>p.active!==false&&p.dueDate).sort((a,b)=>String(a.dueDate).localeCompare(String(b.dueDate))||a.name.localeCompare(b.name,'es'));const normal=state.envelopes.filter(e=>!e.special).sort((a,b)=>(b.priority-a.priority)||a.name.localeCompare(b.name,'es'));const cardRows=cards.map(c=>{const b=cardBalances(c),hasDebt=b.debt>0.005;return `<div class="dist-choice dist-card-row ${hasDebt?'':'off'}" data-card-id="${c.id}"><div class="dist-choice-head"><div class="dist-choice-main"><input class="dist-card-check" type="checkbox" ${hasDebt?'checked':''} ${hasDebt?'':'disabled'}><div><strong>${esc(c.name)}</strong><div class="dist-note">Deuda: ${fmt(b.debt,c.currency)} · Disponible: ${fmt(b.available,c.currency)}</div></div></div><div class="dist-order"><button type="button" class="mini dist-up">↑</button><button type="button" class="mini dist-down">↓</button></div></div>${hasDebt?`<div class="dist-choice-controls"><div class="field"><label>Pago</label><select class="dist-card-mode"><option value="full">Pagar deuda completa</option><option value="custom">Elegir monto</option></select></div><div class="field dist-custom-wrap" style="display:none"><label>Monto (${c.currency==='USD'?'US$':'RD$'})</label><input class="dist-card-amount" type="number" min="0.01" step="0.01" value="${Number(b.debt).toFixed(2)}"></div>${c.currency==='USD'?`<div class="field"><label>Tasa USD para este pago</label><input class="dist-card-rate" type="number" min="0.01" step="0.01" placeholder="Ej. 60.25"><small class="muted">Tasa usada solo en esta distribución.</small></div>`:''}</div>`:''}</div>`}).join('');const monthRows=monthly.map(p=>{const due=String(p.dueDate)<=monthEndISO();return `<label class="dist-choice"><div class="dist-choice-main"><input class="dist-month-check" type="checkbox" data-month-id="${p.id}" ${due?'checked':''}><div><strong>${esc(p.name)}</strong><div class="dist-note">${fmt(p.amount,p.currency)} · Fecha ${dateDO(parseLocalDate(p.dueDate))}${due?' · Pendiente este mes':' · Próximo pago'}</div></div></div></label>`}).join('');const envRows=normal.map(e=>`<label class="dist-choice"><div class="dist-choice-main"><input class="dist-env-check" type="checkbox" data-env-id="${e.id}" checked><div><strong>${esc(e.name)} ${e.priority?'<span class="pill priority">Prioridad</span>':''}</strong><div class="dist-note">Solicita ${fmt(e.request,e.currency)}</div></div></div></label>`).join('');showModal(`<h3>Elegir distribución</h3><p class="muted">Orden: Diezmo/Ofrenda si los activas → tarjetas seleccionadas → pagos seleccionados → sobres seleccionados → sobrante a Disponible.</p><div class="dist-section-title">Tarjetas de crédito</div>${cardRows||'<div class="empty">No tienes tarjetas creadas.</div>'}<div class="dist-section-title">Pagos</div>${monthRows||'<div class="empty">No tienes pagos creados.</div>'}<div class="dist-section-title">Sobres</div>${envRows||'<div class="empty">No tienes sobres normales.</div>'}<div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button type="button" class="btn gold" id="distReview">Vista previa</button></div>`);document.querySelectorAll('.dist-card-mode').forEach(sel=>sel.onchange=()=>{const row=sel.closest('.dist-card-row'),wrap=row.querySelector('.dist-custom-wrap');if(wrap)wrap.style.display=sel.value==='custom'?'block':'none'});document.querySelectorAll('.dist-card-check').forEach(ch=>ch.onchange=()=>ch.closest('.dist-card-row').classList.toggle('off',!ch.checked));document.querySelectorAll('.dist-up').forEach(b=>b.onclick=()=>{const row=b.closest('.dist-card-row'),prev=row.previousElementSibling;if(prev&&prev.classList.contains('dist-card-row'))row.parentNode.insertBefore(row,prev)});document.querySelectorAll('.dist-down').forEach(b=>b.onclick=()=>{const row=b.closest('.dist-card-row'),next=row.nextElementSibling;if(next&&next.classList.contains('dist-card-row'))row.parentNode.insertBefore(next,row)});$('#distReview').onclick=()=>{try{const cardChoices=[...document.querySelectorAll('.dist-card-row')].map(row=>{const card=state.creditCards.find(c=>c.id===row.dataset.cardId),checked=row.querySelector('.dist-card-check')?.checked||false,mode=row.querySelector('.dist-card-mode')?.value||'full',amount=Number(row.querySelector('.dist-card-amount')?.value)||0,rate=Number(row.querySelector('.dist-card-rate')?.value)||0;if(checked&&card.currency==='USD'&&!(rate>0))throw Error(`Escribe la tasa USD para ${card.name}.`);if(checked&&mode==='custom'&&!(amount>0))throw Error(`Escribe el monto que quieres pagar a ${card.name}.`);return {cardId:card.id,checked,mode,amount,rate}});const monthlyIds=[...document.querySelectorAll('.dist-month-check:checked')].map(x=>x.dataset.monthId),envIds=[...document.querySelectorAll('.dist-env-check:checked')].map(x=>x.dataset.envId);previewDistribution(name,baseDOP,cardChoices,monthlyIds,envIds,churchOpts)}catch(err){alert(err.message)}}}
function previewDistribution(name,baseDOP,cardChoices,monthlyIds,envIds,churchOpts={applyTithe:true,applyOffering:true}){const tithe=churchOpts.applyTithe?baseDOP*.10:0,offering=churchOpts.applyOffering?baseDOP*(Number(state.offeringRateRD)||0)/100:0;let left=Math.max(0,baseDOP-tithe-offering);const cardPayments=[];for(const ch of cardChoices){if(!ch.checked)continue;const card=state.creditCards.find(c=>c.id===ch.cardId);if(!card)continue;const debt=cardBalances(card).debt;if(debt<=0.005)continue;const rate=card.currency==='USD'?ch.rate:state.rate;let desiredCard=ch.mode==='custom'?Math.min(ch.amount,debt):debt;if(ch.mode==='custom'&&ch.amount>debt+0.005)throw new Error(`El pago de ${card.name} no puede superar su deuda actual.`);const desiredDOP=card.currency==='USD'?desiredCard*rate:desiredCard,costDOP=Math.min(desiredDOP,left),amountCard=card.currency==='USD'?costDOP/rate:costDOP;if(costDOP>0.005)cardPayments.push({cardId:card.id,name:card.name,cardCurrency:card.currency,amountCard,costDOP,paymentRate:card.currency==='USD'?rate:null,mode:ch.mode,requestedCard:desiredCard});left-=costDOP;if(left<1e-9)left=0}const monthlyPayments=[];for(const id of monthlyIds){const p=(state.monthlyPayments||[]).find(x=>x.id===id);if(!p)continue;const costDOP=p.currency==='DOP'?Number(p.amount)||0:(Number(p.amount)||0)*state.rate;if(costDOP>0&&left+1e-9>=costDOP){monthlyPayments.push({paymentId:p.id,name:p.name,amount:Number(p.amount)||0,currency:p.currency,costDOP,dueDatePaid:p.dueDate,note:p.note||''});left-=costDOP;if(left<1e-9)left=0}else if(costDOP>0){monthlyPayments.push({paymentId:p.id,name:p.name,amount:0,currency:p.currency,costDOP:0,dueDatePaid:p.dueDate,note:p.note||'',skipped:true,requestedAmount:Number(p.amount)||0})}}const selected=state.envelopes.filter(e=>!e.special&&envIds.includes(e.id)).sort((a,b)=>(b.priority-a.priority)||a.name.localeCompare(b.name,'es')),allocations=[];for(const e of selected){const req=e.currency==='DOP'?e.request:e.request*state.rate,got=Math.min(req,left);allocations.push({id:e.id,name:e.name,requestDOP:req,amountDOP:got,currency:e.currency});left-=got;if(left<1e-9)left=0}const envelopeNeed=selected.reduce((s,e)=>s+(e.currency==='DOP'?e.request:e.request*state.rate),0),allocated=allocations.reduce((sum,a)=>sum+a.amountDOP,0),cardUsed=cardPayments.reduce((s,p)=>s+p.costDOP,0),monthlyUsed=monthlyPayments.reduce((s,p)=>s+p.costDOP,0),actualUsed=tithe+offering+cardUsed+monthlyUsed+allocated,balance=(baseDOP-tithe-offering-cardUsed-monthlyUsed)-envelopeNeed;showModal(`<h3>Vista previa</h3><div class="preview"><div class="preview-line"><b>Distribución</b><span>${esc(name)}</span></div><div class="preview-line"><b>Monto</b><span>${fmt(baseDOP,'DOP')}</span></div><div class="preview-line"><b>Diezmo ${churchOpts.applyTithe?'10%':'No aplicado'}</b><span>${fmt(tithe,'DOP')}</span></div><div class="preview-line"><b>Ofrenda ${churchOpts.applyOffering?(Number(state.offeringRateRD)||0)+'%':'No aplicada'}</b><span>${fmt(offering,'DOP')}</span></div>${cardPayments.length?`<div class="preview-line"><b>Tarjetas seleccionadas</b><span></span></div>${cardPayments.map(p=>`<div class="preview-line"><span>💳 ${esc(p.name)}</span><span>${fmt(p.amountCard,p.cardCurrency)}${p.cardCurrency==='USD'?` · tasa RD$${Number(p.paymentRate).toFixed(2)}`:''}</span></div>`).join('')}`:'<div class="preview-line"><span>Tarjetas</span><span>Ninguna seleccionada</span></div>'}${monthlyPayments.length?`<div class="preview-line"><b>Pagos</b><span></span></div>${monthlyPayments.map(p=>p.skipped?`<div class="preview-line"><span>🧾 ${esc(p.name)}</span><span class="red">Sin fondos suficientes · queda pendiente</span></div>`:`<div class="preview-line"><span>🧾 ${esc(p.name)}</span><span>${fmt(p.amount,p.currency)}</span></div>`).join('')}`:'<div class="preview-line"><span>Pagos</span><span>Ninguno seleccionado</span></div>'}<div class="preview-line"><b>Disponible para sobres</b><span>${fmt(Math.max(0,baseDOP-tithe-offering-cardUsed-monthlyUsed),'DOP')}</span></div>${allocations.length?allocations.map(a=>`<div class="preview-line"><span>${esc(a.name)}</span><span>${fmt(a.amountDOP,'DOP')} <small>(${fmt(a.amountDOP/state.rate,'USD')})</small></span></div>`).join(''):'<div class="preview-line"><span>Sobres</span><span>Ninguno seleccionado</span></div>'}<div class="preview-line"><b>Total que se usará</b><b>${fmt(actualUsed,'DOP')}</b></div><div class="preview-line"><b>Sobrante que queda Disponible</b><b class="green">${fmt(left,'DOP')}</b></div>${balance<0&&selected.length?`<div class="preview-line"><b>Faltante para completar sobres seleccionados</b><b class="red">${fmt(balance,'DOP')}</b></div>`:''}</div><div class="modal-actions"><button class="btn soft" data-close>Cancelar</button><button class="btn green" id="confirmDist">Confirmar distribución</button></div>`);$('#confirmDist').onclick=()=>commitDistribution({name,baseDOP,tithe,offering,remaining:Math.max(0,baseDOP-tithe-offering-cardUsed-monthlyUsed),allocations,cardPayments,monthlyPayments:monthlyPayments.filter(x=>!x.skipped),balance,leftover:left,actualUsed,selectedEnvelopeIds:envIds,selectedMonthlyIds:monthlyIds})}
function subtractAvailableDOP(dop){let need=dop;const dTake=Math.min(state.available.DOP,need);state.available.DOP-=dTake;need-=dTake;if(need>1e-9){const usd=need/state.rate;state.available.USD-=usd;if(Math.abs(state.available.USD)<1e-9)state.available.USD=0}}
async function commitDistribution(p){const allocated=p.allocations.reduce((sum,a)=>sum+a.amountDOP,0),cardUsed=(p.cardPayments||[]).reduce((s,x)=>s+(Number(x.costDOP)||0),0),monthlyUsed=(p.monthlyPayments||[]).reduce((s,x)=>s+(Number(x.costDOP)||0),0),actualUsed=p.actualUsed??(p.tithe+p.offering+cardUsed+monthlyUsed+allocated);if(actualUsed<=0.005){alert('No se movió dinero en esta distribución. Selecciona Diezmo, Ofrenda, una tarjeta, un pago o un sobre.');return}const leftover=Math.max(0,p.baseDOP-actualUsed),distId=uid(),sourceUses=sourceUsesForDistribution(actualUsed);subtractAvailableDOP(actualUsed);const titheEnv=state.envelopes.find(e=>e.special==='tithe'),offEnv=state.envelopes.find(e=>e.special==='offering');titheEnv.balance.DOP+=p.tithe;offEnv.balance.DOP+=p.offering;const txDate=now();state.transactions.push({id:uid(),distributionId:distId,accountType:'envelope',accountId:titheEnv.id,type:'add',amount:p.tithe,currency:'DOP',note:'Diezmo · '+p.name,date:txDate,receipts:[]},{id:uid(),distributionId:distId,accountType:'envelope',accountId:offEnv.id,type:'add',amount:p.offering,currency:'DOP',note:'Ofrenda · '+p.name,date:txDate,receipts:[]});for(const cp of p.cardPayments||[]){const card=state.creditCards.find(c=>c.id===cp.cardId);if(!card||cp.amountCard<=0)continue;state.cardTransactions.push({id:uid(),distributionId:distId,cardId:card.id,type:'payment',amount:cp.amountCard,currency:card.currency,paymentRate:card.currency==='USD'?cp.paymentRate:null,note:'Pago por distribución · '+p.name,source:'Distribución',sourceKey:'distribution',sourceTransactionId:null,sourceDebit:{amount:cp.costDOP,currency:'DOP'},date:txDate,receipts:[]})}for(const mp of p.monthlyPayments||[]){const bill=(state.monthlyPayments||[]).find(x=>x.id===mp.paymentId);if(!bill||mp.costDOP<=0)continue;const paidDueDate=bill.dueDate;state.monthlyPaymentTransactions.push({id:uid(),distributionId:distId,paymentId:bill.id,type:'payment',amount:mp.amount,currency:mp.currency,dueDatePaid:paidDueDate,sourceKey:'distribution',source:'Distribución',sourceDebit:{amount:mp.costDOP,currency:'DOP'},date:txDate,note:'Pago por distribución · '+p.name+(mp.note?' · '+mp.note:'')});{const next=nextPaymentDueDate(bill,bill.dueDate);if(next)bill.dueDate=next;else{bill.dueDate='';bill.active=false;}}}for(const a of p.allocations){if(a.amountDOP<=0)continue;const e=state.envelopes.find(x=>x.id===a.id),amt=a.currency==='DOP'?a.amountDOP:a.amountDOP/state.rate;e.balance[a.currency]+=amt;state.transactions.push({id:uid(),distributionId:distId,accountType:'envelope',accountId:e.id,type:'add',amount:amt,currency:a.currency,note:'Distribución · '+p.name,date:txDate,receipts:[]})}state.transactions.push({id:uid(),distributionId:distId,accountType:'available',accountId:null,type:'expense',amount:actualUsed,currency:'DOP',note:'Distribución · '+p.name+(leftover>0.005?' · sobrante permanece Disponible':''),date:txDate,receipts:[]});state.distributions.push({id:distId,name:p.name,date:txDate,baseDOP:p.baseDOP,titheDOP:p.tithe,offeringDOP:p.offering,remainingDOP:p.remaining,balanceDOP:p.balance,leftoverDOP:leftover,actualUsedDOP:actualUsed,allocations:p.allocations,cardPayments:p.cardPayments||[],monthlyPayments:p.monthlyPayments||[],selectedEnvelopeIds:p.selectedEnvelopeIds||[],selectedMonthlyIds:p.selectedMonthlyIds||[],sourceUses,rateAtDistribution:state.rate});await save();$('#modal').close()}
function showDistribution(id){const d=state.distributions.find(x=>x.id===id),leftover=Number(d.leftoverDOP)||0;showModal(`<h3>${esc(d.name)}</h3><div class="preview"><div class="preview-line"><b>Fecha</b><span>${d.date.slice(0,10)}</span></div><div class="preview-line"><b>Monto</b><span>${fmt(d.baseDOP,'DOP')}</span></div><div class="preview-line"><b>Diezmo</b><span>${fmt(d.titheDOP,'DOP')}</span></div><div class="preview-line"><b>Ofrenda</b><span>${fmt(d.offeringDOP,'DOP')}</span></div>${(d.cardPayments||[]).map(p=>`<div class="preview-line"><span>💳 ${esc(p.name)}</span><span>${fmt(p.amountCard,p.cardCurrency)}${p.cardCurrency==='USD'&&p.paymentRate?` · tasa RD$${Number(p.paymentRate).toFixed(2)}`:''}</span></div>`).join('')}${(d.monthlyPayments||[]).map(p=>`<div class="preview-line"><span>🧾 ${esc(p.name)}</span><span>${fmt(p.amount,p.currency)}</span></div>`).join('')}${(d.allocations||[]).map(a=>`<div class="preview-line"><span>${esc(a.name)}</span><span>${fmt(a.amountDOP,'DOP')}</span></div>`).join('')}<div class="preview-line"><b>Sobrante que quedó Disponible</b><b class="green">${fmt(leftover,'DOP')}</b></div>${d.balanceDOP<0?`<div class="preview-line"><b>Faltante para completar sobres seleccionados</b><b class="red">${fmt(d.balanceDOP,'DOP')}</b></div>`:''}</div><div class="modal-actions"><button class="btn soft" data-close>Cerrar</button></div>`)}
function transfer(){const accounts=[{key:'available',label:'Disponible'},...state.envelopes.map(e=>({key:e.id,label:e.name}))];showModal(`<h3>Transferir dinero</h3><form id="transferForm" class="form-grid"><div class="field"><label>Desde</label><select name="from">${accounts.map(a=>`<option value="${a.key}">${esc(a.label)}</option>`).join('')}</select></div><div class="field"><label>Hacia</label><select name="to">${accounts.map(a=>`<option value="${a.key}">${esc(a.label)}</option>`).join('')}</select></div><div class="field"><label>Monto</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Moneda</label><select name="currency"><option value="DOP">RD$</option><option value="USD">US$</option></select></div><div class="modal-actions"><button type="button" class="btn soft" data-close>Cancelar</button><button class="btn">Transferir</button></div></form>`);$('#transferForm').onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ev.currentTarget),from=fd.get('from'),to=fd.get('to'),amount=Number(fd.get('amount')),currency=fd.get('currency');if(from===to){alert('El origen y destino deben ser diferentes.');return}const fromHolder=from==='available'?state.available:state.envelopes.find(e=>e.id===from).balance,toHolder=to==='available'?state.available:state.envelopes.find(e=>e.id===to).balance;const dop=currency==='DOP'?amount:amount*state.rate;if(toDOP(fromHolder)<dop-1e-9){alert('No hay saldo suficiente.');return}withdrawEquivalent(fromHolder,amount,currency);applyAmount(toHolder,amount,currency,1);const date=now(),fromName=from==='available'?'Disponible':state.envelopes.find(e=>e.id===from).name,toName=to==='available'?'Disponible':state.envelopes.find(e=>e.id===to).name;state.transactions.push({id:uid(),accountType:from==='available'?'available':'envelope',accountId:from==='available'?null:from,type:'expense',amount,currency,note:`Transferencia a ${toName}`,date,receipts:[]},{id:uid(),accountType:to==='available'?'available':'envelope',accountId:to==='available'?null:to,type:'add',amount,currency,note:`Transferencia desde ${fromName}`,date,receipts:[]});await save();$('#modal').close()}}
async function backup(){const blob=new Blob([JSON.stringify({version:1,exportedAt:now(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mis-sobres-respaldo-${today()}.json`;a.click();URL.revokeObjectURL(a.href)}
async function restore(ev){const f=ev.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data.state||!Array.isArray(data.state.envelopes))throw Error();if(confirm('Esto reemplazará los datos actuales. ¿Deseas continuar?')){state=data.state;ensureSpecial();if(!Array.isArray(state.creditCards))state.creditCards=[];if(!Array.isArray(state.cardTransactions))state.cardTransactions=[];if(!Array.isArray(state.monthlyPayments))state.monthlyPayments=[];if(!Array.isArray(state.monthlyPaymentTransactions))state.monthlyPaymentTransactions=[];if((state.schemaVersion||1)<6)migrateV6();if((state.schemaVersion||1)<7)migrateV7();await save();alert('Respaldo restaurado correctamente.')}}catch{alert('El archivo de respaldo no es válido.')}ev.target.value=''}
